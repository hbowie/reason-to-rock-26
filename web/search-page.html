        url: "christmas-baby-please-come-home.html", 
        summary: "<p>The lyrics in this song work so well because of their simple understatement. As in the title, the single word “Christmas” is repeated by the background choir to begin each line of the song. Darlene Love </p>", 
        content: "The lyrics in this song work so well because of their simple understatement As in the title the single word Christmas is repeated by the background choir to begin each line of the song Darlene Love then describes in the briefest of sketches familiar elements of Christmas The snow s coming down Lots of people around Pretty lights on the trees etc Each verse ends with the same line Christmas Baby Please Come Home The chorus fills in the sketchiest of details > They re singing Deck the Halls > But it s not like Christmas at all > Cause I remember when you were here > And all the fun we had last year And that s all we re told really Boy and girl together last Christmas Boy and girl not together this Christmas Girl misses boy So the apparent conflict is in their separation But there s something else going on here There is no happy ending The boy never shows up If we listen closely to the lyrics and their delivery though we can feel another kind of tension There is another conflict occurring and that is between the forced joy of the season and the singer s own personal feelings of being sad and lonely Once we become aware of this implicit conflict the pieces of the song fall into place We realize that the background choir is a group of people singing the single word Christmas over and over in a monotone the effect being almost oppressive In contrast Love s individual vocal is marvelously expressive her voice caressing and playing with every word every syllable In this new light the details of the season can be seen as constant tugs to involve the singer in the traditional social events of the season to give up her feelings of loneliness and isolation to go with the flow With this tension in mind let s see how the conflict plays out and reaches resolution The song opens quietly Strings quaver in the background foreshadowing the emotions to come Christmas bells ring on the beat A lonely halting bass line climbs the scale and then descends repeatedly audio xmas opening mp3 We work our way through the simple chord structure for one verse Then the drums accelerate and launch us into the first vocal verse The vocal verses are richly layered Multiple percussion instruments play interlocking rhythms strings play counterpoint to the vocal what sounds like a saxophone is used to add to the rhythmic surge audio xmas verse mp3 Darlene Love s magnificent vocal soars in and around the pounding rhythms like a surfer working her way through heavy swells just beyond the reach of the undertow harnessing all that power playing with it A saxophone solo serves as punctuation It is rich and warm reminding us of the intimacy lost the closeness needed but no longer available audio xmas sax mp3 Another chorus then the final verse Darlene Love s voice quivers on the final word of each line as if on the verge of tears near breakdown If there was a way I d hold back this tear but it s Christmas Day please Now the background singers echo her plea Please The call and response continues accelerates trading this one word back and forth faster and faster a piano now building in the background begging for release gradually climbing the scale the pounding of the drums accelerating until Darlene finally explodes Baby please come home The piano soars now Darlene repeats her request The drums run free no longer just carrying the beat but improvising as the power of the climax winds down into release Conflict between seasonal reminders and personal feelings are resolved as the singer expresses her emotions fully and completely Liberated from all restraint she pours her true emotions out honestly and openly without shame or remorse It s instructive to compare this recording to another belonging to a prior generation but with very similar lyric and thematic content One For My Baby And One More For The Road was one of Frank Sinatra s favorite songs This is a similar tale Boy meets girl Boy loses girl Boy misses girl And similarly the tension in this song is also between the need to control and suppress one s feelings and the need to express them The setting for the Sinatra song though is in a quiet bar late at night The singer is able to express his feelings only to the bartender and only after several drinks He expresses his feelings with great restraint referring to them indirectly saying that he has to tell someone or he soon might explode Given all these similarities what is interesting is how different the two recordings are The resolution of the Sinatra song is in the bar closing the singer getting himself under control successfully suppressing his feelings The resolution of the Spector song is in the singer completely expressing and releasing her feelings Whereas Sinatra successfully avoids an explosion Love successfully explodes The lyrics to the Sinatra song are clever and ironic The lyrics to the Spector song are direct and effective Sinatra offers a wonderful interpretation of One For My Baby playing the part almost as an actor might Love simply uses the words and melody as a starting point with the real effect coming in the arrangement and vocal delivery Instrumental backing for the Sinatra song is spare and low key echoing the reserve of the singer and emphasizing the understated irony of the lyrics Instrumentation for the Spector song is rich and multi layered representing the powerful opposing forces at work in the song and the ultimate emotional release of the singer All in all this masterpiece from Spector and Love is a wonderful example of the Overview|new aesthetic offered by rock music BTW much like Frank Capra s It s A Wonderful Life the initial release of the original recording did not have any significant commercial success but has since become something of a Christmas standard The song was later covered by many artists and David Letterman invited Darlene Love to perform the song on his annual Christmas show every year for 29 years beginning in 1986"

    { 
        title: "Like A Rolling Stone", 
        date: "", 
        url: "like-a-rolling-stone.html", 
        summary: "<p>“Like A Rolling Stone” is not only one of the most popular rock songs of all time, it is also one of those whose appeal is the most mysterious. </p>", 
        content: " include quotebiblio They all know the chorus to that song Like A Rolling Stone is not only one of the most popular rock songs of all time it is also one of those whose appeal is the most mysterious Whereas it is easy to see how other Dylan songs became anthems for a generation songs like Blowin in the Wind The Times They Are A Changing and Mr Tambourine Man it is harder to see how this song attained such a broad and enthusiastic audience A song like Blowin In The Wind https www bobdylan com songs blowin wind appealed to the masses by asking a series of pointed moral questions and then explicitly saying that the questions are unanswerable But the climactic line of this song is itself an unanswerable question and one with less obvious relevance How does it feel to be like a Rolling Stone What on earth was going on here and why did people get so excited by it As we will see the greatness of the song lies in the intricacy of its working the way so many parts come together to make a cohesive compelling and unique whole The challenge in describing the recording is to look at it piece by piece and yet still be able to put it back together at the end and see it work Let s take it a step at a time A good place to start is in the relationship of the words to the music A criticism leveled at much of rock and at Dylan in particular as he began making rock music rather than folk was that the words were hard to hear Certainly in much of rock music this was true and intentional foreground and background merged the words and vocals became part of the mix part of a wall of sound in some cases But in this recording that usual criticism does not apply It is not that the music is not full and loud organ piano electric guitar and bass drums and tambourine are all working together making for a complex musical tapestry But all this music never overwhelms the vocals As a matter of fact they simply form a rich background with Dylan s vocals clearly in the foreground every word and nasal intonation clearly etched and standing out in sharp relief from the instruments This will mean more to us as we come to understand more of the song but for now let s just take this to mean that the words are important and need to be understood include quotebiblio I don t want to scream it So with that thought in mind let s look at the lyrics and see what they have to say Note that I ve broken the verses into short lines at times to make it easier to see the rhyming scheme more on this later > Once upon a time > You dressed so fine > You threw the bums a dime > In your prime > Didn t you > > People d call > Say Beware doll > You re bound to fall > You thought they were all > Kiddin you > > You used to laugh about > Everybody that was hangin out > Now you don t > talk so loud > Now you don t > seem so proud > About having to be scrounging > for your next meal > > How does it feel > How does it feel > To be without a home > Like a complete unknown > Like a rolling stone > > You ve gone to the finest school > All right Miss Lonely > But you know you only > Used to get > Juiced in it > > And nobody has ever taught you > How to live on the street > And now you find out > You re gonna have to get > Used to it > > You said you d never compromise > With the mystery tramp but now you realize > He s not selling any alibis > As you stare into the vacuum of his eyes > And ask him do you want to > Make a deal > > How does it feel > How does it feel > To be on your own > With no direction home > Like a complete unknown > Like a rolling stone > > You never turned around > To see the frowns > On the jugglers and the clowns > When they all come down > And did tricks for you > > You never understood > That it ain t no good > You shouldn t let > Other people get > Your kicks for you > > You used to ride on the chrome horse with your diplomat > Who carried on his shoulder a Siamese cat > Ain t it hard when you discover that > He really wasn t where it s at > After he took from you everything > He could steal > > How does it feel > How does it feel > To be on your own > With no direction home > Like a complete unknown > Like a rolling stone > > Princess on the steeple > And all the pretty people > They re drinkin thinkin > That they > Got it made > > Exchanging all > Precious gifts > But you d better > Take your diamond ring you d better > Pawn it babe > > You used to be so amused > At Napoleon in rags and the language that he used > Go to him now he calls you you can t refuse > When you ain t got nothing you got nothing to lose > You re invisible now you got no secrets > To conceal > > How does it feel > How does it feel > To be on your own > With no direction home > Like a complete unknown > Like a rolling stone At first glance the song seems to be about class division The woman addressed by the singer is clearly from the upper class having gone to the finest schools consorted with diplomats and exchanged precious gifts with friends and family At the other end of the spectrum we have the mystery tramp and Napoleon in rags The dramatic movement in the song at this level is simple some event has caused the woman to fall from grace to be cast out from the upper social circles and to have joined the ranks of those who have no material possessions There is more going on here though The words are also about illusion and understanding deception and truth The song repeatedly describes ways in which the woman failed to see what was really going on around her She never saw the frowns on the jugglers and the clowns thought that people were joking when they said she was riding for a fall failed to realize that the diplomat was using her and so on It s worth noting how quickly and deftly Dylan introduces all of this The first line encapsulates the class issue and tells us of the woman s fall Once upon a time you dressed so fine threw the bums a dime in your prime didn t you The second line then tells us how blind the woman was to what was going on around her People used to call say Beware doll you re bound to fall you thought they were all kidding you It is instructional to compare this song to a couple of similar ones written about the same time Positively Fourth Street and Ballad of a Thin Man The former is about someone who claims to be a friend of the singer s and concludes with the most biting put down in all of rock Yes I wish that for just one time you could stand inside my shoes Then you d know what a drag it is to see you Similarly the latter talks about someone who is clueless each chorus ending with the line Because something is happening here but you don t know what it is do you Mr Jones In all three of these songs Dylan the singer is directly addressing an individual who has been unaware unenlightened What makes Like A Rolling Stone different from the other two and more interesting is that it is more than just a character sketch more than just a scathing commentary in this song there is dramatic movement the woman who has been unaware has experienced a fall and from that experience has an opportunity to change to learn to grow And brilliantly each verse describes one more experience from which the subject might learn takes the subject to the brink of enlightenment asks the key questions whose answers would provide resolution then stops begins again and repeats the process Now let s turn next to the structure of the song Let s start with just the first four mini lines as shown above > Once upon a time > You dressed so fine > You threw the bums a dime > In your prime The short line length the fairy tale opening the simple words and images the straightforward aaaa repeating rhyme all these elements work together to create the feeling of a children s song of a child s world Little miss Muffet Sat on a Tuffet Eating her curds and whey uses similar devices to similar effect for example In conjunction with the themes we have discussed these devices suggest that the woman in our story started her adventure with a certain childish simplistic approach to life apparently thinking that everything around her was placed there solely for her own amusement But then Dylan does something really interesting The first extended line or verse or whatever we call it the first sentence certainly is not yet finished The singer pauses and then tosses off the following question > Didn t you What is this A fifth line that doesn t rhyme with any of the first four yet is clearly part of this first sentence Do you see what Dylan is doing He is using the very structure of the song to let us know to let the woman know that there is more going on more to the song and more to life than this simple children s world The words are about illusion and reality deception and truth But the lines verses and rhymes are also playing with these same ideas first making us think that this is a simple children s song then showing us a larger world of which this childish beginning is no more than a piece The next extended line uses the same structure > People d call > Say Beware doll > You re bound to fall > You thought they were all > Kiddin you But note that by pairing these two similar verses and ending that hanging fifth line with the same rhyme in both the same word in this case he is at the same time building a larger structure a richer pattern So now we can see that the longer rhyming scheme is aaaab ccccb Thematically the effect is in concert with the words the gradual revelation of a larger more complex world than the one we started with Let s see what comes next > You used to laugh about > Everybody that was hangin out > Now you don t > talk so loud > Now you don t > seem so proud > About having to be scrounging > for your next meal This is a different melody now and a different verse structure The rhyming pattern is now ddeefg Again though Dylan employs the same device ending the line verse sentence with an unmatched rhyme leaving us hanging waiting for closure wondering how the pattern comp         content: " include quotebiblio We sat down and wrote it together This track is a profound example of how the lyrics of a song can be extended and amplified by the music Let s start with a little biographical context as first Neil Aspinall The Beatles roadie and then John Lennon primary author of Rain recall The Beatles arrival in Australia include quotebiblio Pissing down with rain include quotebiblio We were having hysterics So you can appreciate the situational and attitudinal backgrounds from which John wrote the lyrics for the song > If the rain comes they run and hide their heads > They might as well be dead > If the rain comes > If the rain comes > > When the sun shines they slip into the shade > And sip their lemonade > When the sun shines > When the sun shines > > Rain I don t mind > Shine the weather s fine > > I can show you that when it starts to rain > Everything s the same > I can show you > I can show you > > Rain I don t mind > Shine the weather s fine > > Can you hear me that when it rains and shines > It s just a state of mind > Can you hear me > Can you hear me At its most obvious level this is a song as John says in the Anthology about people moaning about the weather all the time The Beatles Anthology|Beatles 2000 And when the lyrics are taken alone it is hard to make a case for the song being about much of anything else At my count the entire song is written using a vocabulary of only 44 words So you could even make a case that the lyrics offer nothing more than a rough sketch Once we consider the words in the context of the music though they take on added weight First because their reading in the song is so slow with many words stretched out into multiple beats and syllables there is an added emphasis to the lyrics audio rain rain mp3 The result is to put more weight on the words than their surface meaning will bear thus suggesting to the listener that there is a hidden or additional meaning The effect is almost revelatory giving the impression that some important secret or prophecy is being disclosed The music also suggests in other ways that the weather is to be taken as a symbol of something else The Beatles do this by making the music itself represent the condition they are describing Paul says in the Anthology On Rain I remember we couldn t get a backing track and we decided to play it fast and slow it down We had to play it fast and accurately The Beatles Anthology|Beatles 2000 In other words they played the backing guitar at a fast speed recording this on tape and then played the tape back at a slower speed John also stumbled on the idea of recording a guitar and voices backwards In other words he sang and played guitar along with the backing track while it was being played backwards then reversed the direction of the voice and guitar and combined them with the backing track while being played forward The effect is quite noticeable since it reverses the normal attack and decay rates associated with a guitar audio rain backwards mp3 There is also Ringo s stop and go drumming on the song and Paul s burbling bass playing a repeated line that varies in tempo and that runs quickly from the lower to the upper register and back again audio rain bass mp3 The effect of all these musical devices is to represent the rain or shine polarities in musical terms So The Beatles are in effect saying not only Rain or shine I don t mind but also fast or slow backwards or forwards stop or go high or low As John sings in the song I can show you and he does quite literally And he is referring to more than just the words he is singing when he asks Can you hear me John s voice is even altered further on these last two lines using some other studio effects giving the words a sort of hallucinogenic clarity audio rain show mp3 So the implication is clearly that the vagaries of the weather are at some deeper level symbolic of something else But of what If we take the musical effects to be further symbols then we are at er being generated The emotional reserve of the singer now begins to make more sense since the singer is suggesting that cooler heads prevail that people stop and look at what they are creating The musical accompaniment suggests movement and increasing intensity Neil Young plays an electric guitar break between the end of this chorus and the beginning of the next verse While the pace is still sedate and the volume low the addition of the electric guitar part does indicate that something is indeed happening and the tremolo and bent notes give some premonition of what is to come audio for what its worth guitar1 mp3 The next verse provides even more context giving our first details of a specific event since the mention of the man with a gun in the first verse > What a field day for the heat > A thousand people in the street > Singing songs and carrying signs > Mostly say Hooray for our side > It s time we stop hey what s that sound > Everybody look what s going down It is interesting to see all the meanings of the word heat that are invoked in the first line First it could refer to the actual temperature on the streets in L A Second it could refer to an intensity of emotion or to pressure and stress Third it is a slang term for a pistol and thus serves as a reminder of the gun mentioned in the first verse Fourth it is a slang term for the police finally giving some identity to the man with the gun All these meanings resonate with the listener given the context of the song Again the singer intentionally affirms the irrelevance of the issues being discussed by referring to songs and signs mostly saying hooray for our side without any further identification of what the sides represent At the same time he is again pointing out the divisiveness of the conflict The music continues to intensify in this verse with ominously descending background vocals behind Stills voice Young s guitar at the end of the chorus is again restrained but with the stretched notes intensifying suggesting a sort of distortion or transformation taking place audio for what its worth guitar2 mp3 The fourth and final verse makes the singer s warning explicit > Paranoia strikes deep > Into your life it will creep > It starts when you re always afraid > You step out of line the man come and take you away As suggested earlier the singer s concern is about the loss of innocence and the introduction of violence and fear into his community The music pulls out all the stops now with background vocals behind all of Stills lyrics hand claps added for percussive effect and Young s distorted guitar playing throughout the verse The song concludes with Stills and background singers repeating the chorus several times with minor variations in lyrics and melody each time Young s guitar continues in the background seemingly representing the chaos and destruction potentially being unleashed The guitar continues after the vocals are done then fades out leaving the stated threat hanging unvanquished audio for what its worth guitar3 mp3 Note that the title of the song For What It s Worth appears nowhere in the song s lyrics Instead it serves to comment on the situation being addressed further cooling down the emotional environment by suggesting that the worth of the opinions being expressed can best be evaluated by the listener Rock is often accused of being loud overbearing aggressive and violent And yet here we have a song where folk and country western traditions are used to undercut and restrain those very tendencies in fact to warn of their dangers The beauty of this song is that it manages to warn of increasing polarization and violence in American society without taking any stand other than that of acceptance of diversity and free speech In other words it comments on politics without itself being political And while Stills includes comments on authority he seems to mainly address his peers subtly warning that strident defense of their positions and attacks against their opponents might threaten the very freedoms attitudes and life styles they are seeking to protect In retrospect one has to give prophetic credit to Stills song It was only a few years later when Stills and Young along with new partners Crosby and Nash would release Young s composition Ohio Featuring the lyrics Tin Soldiers and Nixon coming We re finally on our own and ending with the terrible refrain Four dead in Ohio the song memorialized four students who had been shot dead at Kent State University during a protest against the Viet Nam war By this time the violent confrontation and polarization warned of in For What It s Worth had sadly come to pass It s interesting to see how the presentation of For What It s Worth evolved in later years The CSN Y live album Four Way Street presents the same song with Stills accompanying himself on piano and with vocals that are positively histrionic when compared with the laid back singing of the original recording By 1971 it seems the emotional reserve of the original could no longer be maintained even though the message still needed to be heard more than ever"

edal and other devices to represent a disorienting almost inhuman sonic landscape audio watchtower guitar1 mp3 The third musical element I want to comment on and the one that really frames and defines the whole song is Jimi s repeated gradually progressing ascents up the scale with blistering notes Listen first to the guitar break between the first and second verses audio watchtower keen1 mp3 Then listen to the second and longer guitar break between the second and third verses audio watchtower keen2 mp3 And then finally listen to the way it sounds at the end of the song audio watchtower keen3 mp3 Notice how Jimi seems to be gradually reaching for a note that he only finally hits at the end of the song And then when he gets there he repeats it over and over making a high keening sound representing not only the howling wind referred to in the last line but that coming conflict that the song so clearly prepares us for And the music ends on this note as do the lyrics without resolution but clearly pointing forwards to some anticipated future act of liberation This is simply a brilliant collaboration between songwriter and musician the accompaniment extending and reinforcing the meaning and drama of the lyrics and showcasing the unique possibilities of the electric guitar along with nothing more than a bass drum kit and acoustic guitar"

        url: "white-room.html", 
        summary: "<p>This song was a huge hit single for Cream, off their <em>Wheels of Fire</em> album. </p>", 
        content: "This song was a huge hit single for Cream off their Wheels of Fire album Lyricist Pete Brown says of the track It was a miracle it worked considering it was me writing a monologue about a new flat Sandford 1999 Let s take a look at the words Brown wrote about his new accommodations > In the white room with black curtains near the station > Black roof country no gold pavements tired starlings > Silver horses ran down moonbeams in your dark eyes > Dawn light smiles on you leaving my contentment > > I ll wait in this place where the sun never shines > Wait in this place where the shadows run from themselves > > You said no strings could secure you at the station > Platform ticket restless diesels goodbye windows > I walked into such a sad time at the station > As I walked out felt my own need just beginning > > I ll wait in the queue when the trains come back > Lie with you where the shadows run from themselves > > At the party she was kindness in the hard crowd > Consolation for the old wound now forgotten > Yellow tigers crouched in jungles in her dark eyes > She s just dressing goodbye windows tired starlings > > I ll sleep in this place with the lonely crowd > Lie in the dark where the shadows run from themselves Probably the first observation worth making is that this is a fairly serious bit of modern poetry to be used as a lyric for a rock song Considering its singularly uncatchy title its lack of rhyme or alliteration and the absence of any easily discernible or involving subject matter one might even agree with its author that it is a miracle that it worked at all The next thing one notices perhaps is that despite the absence of other traditional poetic trappings the lyrics have a very structured and highly unusual meter The verses have twelve syllables per line and these tend primarily to fall into three feet per line four syllables per foot with the accent on the third syllable of each foot The conformity to this meter is not perfect and the first two syllables of each four syllable foot tend in particular to vary from this pattern But the effect is still striking and the attempt to stick to this pattern is one explanation for the frequent variation from regular grammatical structures since it would be hard to accommodate both Given all this other variation from normal pop standards it is positively reassuring to see that the words fall into a straightforward verse and chorus structure Although each chorus is worded differently the repetition of the phrase where the shadows run from themselves to conclude each chorus provides some familiar grounding The choruses also provide some relief from the rather demanding meter in the verses offering a more familiar beat to the listener s ears The future tense used consistently in the choruses also offers some contrast to the present and past tenses used in the verses We also find some reassurance when we turn our attention to the meaning of the poem seeing that there is a familiar boy meets girl boy loses girl theme However the absence of a smooth narrative flow is somewhat disconcerting The poem is written in the first person and what we hear are a series of somewhat disjointed observations made by the poet What makes the poem interesting in part is that the nature of the observations shift dramatically and frequently If we take the first verse for example we find that the first two lines offer literal descriptions of almost random elements of external physical reality In the white room with black curtains near the station Black roof country no gold pavements tired starlings The third line however shifts to a fantastic metaphor Silver horses ran down moonbeams in your dark eyes The fourth line shifts again mixing the first two modes somewhat and adding an internal observation on the poet s feelings Dawn light smiles on you leaving my contentment Beneath the somewhat jumbled narrative of the boy girl story line however lies another conflict and one that is really at the center of the poem What is most striking about the words are the utter lack of meaning or feeling in the poet outside of his contact with the girl in the story If we take the poet s observations as reflections of his inner state what we find initially is a flat existence Let s look again at the first two lines In the white room with black curtains near the station Black roof country no gold pavements tired starlings Note the monochromatic nature of the poet s world the room is white the curtains and rooftops are black the pavements are not gold Even the birds are tired Now contrast this flat colorless language with that of the next line Silver horses ran down moonbeams in your dark eyes Now we have excitement motion color beauty energy This same sort of contrast is continued in the remaining verses Beginning the third verse for example we find that even at a party the crowd is hard with the woman offering the only kindness And again we have color and life associated with the woman and the woman only Yellow tigers crouched in jungles in her dark eyes The choruses make the poet s situation more poignant referring to his room as a place where the sun never shines and where the shadows run from themselves At this point it is hard not to identify the poet s room with his own internal consciousness Certainly it is hard to picture an objective physical meaning to the image of shadows running from themselves But if we take this as an internal symbol then this makes perfect sense given what we have learned in the verses it is easy to see the poet himself as one of the shadows running from himself in order to escape his colorless view of the world and his own isolation I have spent a lot of time focusing exclusively on the words but as we turn to the recording we will find that the music beautifully amplifies and extends these devices we have discovered in the lyrics To begin with the track opens with a brilliantly ominous sound composed partly from the unlikely rock instruments of viola and tympani audio white room intro mp3 Baker provides the transition to the first verse by striking his snare and then we are off The melody and chords provided by Bruce perfectly complement the lyrics provided by Brown with the pacing of the melody for the verse emphasizing the unusual meter with a pause after each four syllables neatly breaking each line up into three feet The descending melodic line is suggestive of the mood and seriousness of the piece Bruce s reading of the lyrics is relatively flat and unemotional again reinforcing the lyric intent Bruce s bass and Baker s drums are propulsive but slow and regimented again suggesting the internal state of the singer Clapton s guitar lurks in the background at this point quietly playing the chords going almost unnoticed audio white room in the mp3 Bruce sings the chorus in a sweet falsetto emphasizing the poignancy of the lyrics As we end the chorus and start the second verse however a new element is introduced in the form of Clapton s lead guitar The contrast between Clapton s lines and the rest of the song is extreme The stinging guitar is played with heavy wah wah pedal at a higher pitch than the vocal and other instruments and with melodic lines that seem to fight against the slowly descending lines of the rest of the track After the second verse and chorus the ominous sound of the opening is repeated taking the place of a bridge or solo either of which would be a distraction Clapton s guitar returns with a vengeance in the third verse now openly playing on top of the singer and other musicians Clapton is simply brilliant here He improvises ruthlessly on guitar opposing the melodies and rhythms of the rest of the performers His playing is uncontained seemingly uncontainable as it claws and kicks against the impending doom of the rest of the song audio white room clapton mp3 In the context of the words and music Clapton s guitar seems to represent some anarchic seminal life force fighting against the colorless regimented neatly contained emotional life of the singer Following the third and final verse and chorus the ominous sound is repeated then extended slightly as if the song were ending But then the music starts up again with a crash from Baker s drums and Clapton s guitar returns to its heroic struggle against the forces of darkness and lifelessness The music slowly fades the conflict unresolved the tension still continuing This recording is simply a brilliant example of the best that rock has to offer Lyrics vocals music and instrumental parts all work together to produce a complex unified unique effect"

        url: "sympathy-for-the-devil.html", 
        summary: "<p>The first thing to be said about this track is how utterly different it is from most rock songs. In a field where compositions are most often about sexual or romantic relationships, with a significant minority </p>", 
        content: "The first thing to be said about this track is how utterly different it is from most rock songs In a field where compositions are most often about sexual or romantic relationships with a significant minority about the music itself or about philosophy we have here a first person narrative from Beelzebub Lyrically and thematically the song is in a class by itself Similarly the instrumentation is rather odd for a rock song Percussion is provided by what sounds like a combination of snare drum conga drums and maracas The steady 4 4 backbeat for which rock is famous propelled on by bass drum is replaced by a more complex samba rhythm So far as I can tell there is no rhythm guitar on the track Instead we have electric bass and piano the latter courtesy of famed session man Nicky Hopkins propelling the song along and defining its chord structure The bass guitar is featured prominently taking on something of the role normally played by rhythm guitar perhaps because it is played by normal lead guitarist Keith Richards rather than the Stones usual bass player Bill Wyman Heart of Stone|Di Perna 2002 Another unusual element of the song is the way it evolves and progresses over its course In general rock songs tend to repeat the same instrumental accompaniment from one verse to the next In this song though there is a definite progression with additional instruments and vocals being added to successive verses More about this later Let s consider the lyrics next What are they all about If you take them at face value you might consider that Mick Jagger as lead vocalist and lyricist is sincerely suggesting that the devil really isn t such a bad fellow After all he says every cop is a criminal and all the sinners saints and it was you and me who killed the Kennedys So what s the difference We re all the same aren t we He s just one of the lads Look more deeply though and you will find that this confusion of good and evil of appearance and reality is really just a ploy of the evil one The devil may appear to be a gentleman a man of wealth and taste He may appear to be polite and a member of good society approaching you with the words Let me please introduce myself and pleased to meet you But alongside of this we have a long catalog of some of the worst atrocities of human history starting with the torture of Christ on the cross and ending with the modern assassination of the Kennedys so contemporary in fact that the lyrics were changed from John Kennedy to the Kennedys while the Stones were in the studio recording the song Along the way we have the Crusades and the Bolshevik revolution in Russia thrown in for good measure So let there be no mistake there really is evil in the world This then is the real significance of the taunting refrain Hope you guess my name But what s puzzling you is the nature of my game This is not Mick Jagger saying hope you can guess that I m playing the devil in this song That s obvious from the beginning No this is the devil saying Hope you recognize me when you see me because I come in many guises And my game is not to do evil myself but to trick you into doing it This confusion between appearance and reality between good and evil runs throughout the song Christ is mentioned not only for the pain that he experienced but for his moment of doubt And in addition to all the acts of violence described the devil says that he has stolen many a man s soul and faith His interest in the son of God was not limited to the torture of Christ himself he also made damn sure that Pilate washed his hands and sealed his fate And his final threat to the listener is to lay your soul to waste Just in case we might be in danger of taking Jagger s appropriation of the devil as a serious case of religious conviction he throws in the lines I watched with glee while your kings and queens fought for ten decades for the gods they made So Jagger is not seriously arguing Christian doctrine here Instead Jagger seems to be using the devil as a symbol a personification of evil and of how it works in the world What the words seem to be saying is that there is evil in the world and we need to be on our guard because evil will not always appear as such and may often be disguised by those who would wish to deceive us So now that we ve got a fix on the words let s examine the music and see how it expands and reinforces the meaning of the song The track opens with an unusual beat pounded out on one drum What sound like congas then enter the mix adding accents on the final beats of the repeated line Maracas follow Together they make up what sounds like a jungle beat Jagger howls in the background his voice altered electronically to sound more bestial and echoing in the distance adding to the threatening impression of being in a dark jungle The howls are followed by grunts now sounding human but primitive audio sympathy opening mp3 The beat continues but the piano now enters with a slow stately series of chords Jagger appears on top of this with his most refined British accent half speaking half singing Please allow me to introduce myself I m a man of wealth and taste So we immediately have a jarring clash in perceptions are we in a jungle or a stately English manor What is real and what is illusion Jagger makes it through the first four lines before the propulsive bass starts building on the percussive mix still continuing in the background The effect is to pick up the pace to add a driving menace to the song The bass is not used to play a repetitive riff Instead it improvises relentlessly giving the impression of a prowling danger lurking just beneath the surface of Jagger s refined appearance audio sympathy bass mp3 We make it through the first verse and chorus with Hopkins still framing chords on the piano at a measured even pace But now as the bass kicks off the second verse Hopkins joins the fray playing faster improvising and picking up the underlying rhythm of the percussion instruments The music perfectly mirrors the anarchy portrayed in Jagger s lyrics as he describes the overthrow of the tzars and the blitzkrieg At the same time Jagger s voice becomes less controlled singing shouting now although still showing perfect enunciation on words like stank On the third verse we pick up background vocals singing high pitched whoo whoo s at the end of each line The vocals are almost childishly simple yet effective adding a ghost like refrain to the continuing rhythmic churning of the instruments Jagger s vocals are strained now cracking with emotion on nearly every word Keith Richards takes the fourth verse playing a brilliant slippery snake like guitar solo Never quite on the beat sliding from note to note producing a quick run of stinging notes one second then a single note held for several beats in the next Richards guitar is the perfect musical representation of Jagger s character in the song unpredictable anarchic elusive shape shifting audio sympathy guitar mp3 After the solo we hear Jagger return for the usual chorus This is followed by a closing verse and chorus finishing off the tale told by the words But now the lid is completely taken off the instrumental mix percussion bass piano lead guitar and vocals jam on improvising continuously Richards guitar and Jaggers vocals play off of one another echoing slyly mimicking each other Jagger begins singing fragments from the song in a scratchy falsetto Chaos reigns with Jagger repeatedly taunting Can you guess my name audio sympathy endjam mp3 Finally the song fades its activity not ended but seemingly just continuing at a greater distance moving to another town another audience Producer Jimmy Miller certainly deserves a lot of credit for this track providing the vessel that holds the volatile mixture together the unseen hand keeping the necessary order in the background so that apparent anarchy can rule in the foreground Nicky Hopkins and the percussion players add to the brew keeping the pot boiling always seemingly on the verge of spilling out of control Jagger has sometimes become known as a poseur acting jaded and decadent for the sheer amusement of it here though his artifice certainly serves a higher aesthetic purpose All in all this is a brilliant unique track"

    { 
        title: "You Can All Join In", 
        date: "", 
        url: "you-can-all-join-in.html", 
        summary: "<p>Let’s start with a review of the lyrics. </p>\n\n<blockquote>\n\n<p>Here’s a little song you can all join in with:<br />\nIt’s very simple and I hope it’s new.<br />\nMake your own words up if you want to:<br />\nAny old words that you think will do. </p>\n\n<p>Yellow, blue, what’ll I do?<br />\n</p>\n</blockquote>\n", 
        content: "Let s start with a review of the lyrics > Here s a little song you can all join in with > It s very simple and I hope it s new > Make your own words up if you want to > Any old words that you think will do > > Yellow blue what ll I do > Maybe I ll just sit here thinking > Black white stop the fight > Does one of these colours ever bother you > > Here s a little dance you can all join in with > It s very simple and I hope it s new > Make your own steps up if you want to > Any old steps that you think will do > > Left right don t get uptight > Keep in line and you ll be alright > Clap hands move around > Make sure no one puts you down > > Here s a little world you can all join in with > It s very simple and I hope it s new > Make your own life up if you want to > Any old life that you think will do > > Love you it s nothing new > There s someone much worse off than you are > Help me set them free > Just be what you want to be Perhaps the first thing to confess about these lyrics is that they don t stand alone very well as poetry That is there is nothing particularly deep subtle or powerful about the way the words work on the listener This admission is not a damning one however since the whole point of rock is that the words don t have to stand on their own But having gotten this admission out of the way let s see what the words do offer us There s a pleasant combination of repetition and progression going from one verse to another as the singer proceeds to talk first about the song then a dance then finally the entire world The overall theme of the song is one of liberation telling the listener to make your own life up if you want to any old life that you think will do At the same time though there is a theme of responsible community issues of race relations conformity and love for your fellow man are all raised if not exactly dealt with More convincingly the singer tells us that you can all join in with the song the dance and ultimately the world All in all pleasant sentiments It is the music however that lends authority to the words First the structure of the song seems borrowed from a square dance or a reel or some other sort of communal folk dance This immediately adds resonance and authenticity to the lyrics reminding us of simple communities of the past in which some of the lyrics were very literally true people did take turns calling out different lyrics and dance steps for each verse of the song Then there are the track s infectious rhythms woven from vocals hand claps acoustic and electric guitars and Chris Wood s saxophone audio you can all join in handclaps mp3 Even today after hearing the song repeatedly over the course of thirty plus years it is hard for me to listen to the song without breaking into a grin and tapping my feet So in a very real way the listener does join in responding affirmatively to the singer s invitation Finally there is the loose collaboration of the song s music Background vocals and hand claps appear at times There is space between verse and chorus after each chorus and at the end of the song for improvisation These spaces are filled by Mason on electric guitar Wood on sax and Mason on vocals Dave Mason actually demonstrates his verbal suggestions making up additional lyrics to the song while guitar and sax vamp in the background Again there is nothing particularly exciting about the words themselves some of them are simply nonsense words or noises but Mason creates the completely genuine impression that he is making them up as he goes along He even pulls the producer into the fray observing towards the end of the song There s Jimmy Miller swinging to and fro audio you can all join in such fun mp3 The overall effect is one of people expressing their own individuality yet working together in harmony exactly the theme of the lyrics And there is nothing gratuitous or self indulgent about the recording the whole affair clocks in at only three minutes and thirty four seconds I have to admit that I find this recording utterly convincing The music exhibits the sense of New Forms of Collaboration|cooperative democracy that was at the heart of rock music in the sixties Each contributor s work bears the unmistakable stamp of its creator Mason s folky lyrics and vocals and infectious acoustic guitar and jazzy electric guitar stylings Wood s honking saxophone Miller s production values yet all these contributions work together in a harmony all the more beautiful because it was clearly not planned not arranged in advance but simply sprang naturally out of the affinity the contributors had for each other This was a genuinely new way of working living and being together and for all of its fragility it still makes me want to ask thirty years on why more of our lives can t be lived like this"

        content: "Before we consider this particular recording we should note that it comes from an album named Volunteers whose cover depicts the band in various forms of odd and partial dress in front of an American flag The album s title and cover relate to the closing track of the original album in which the singers state that we are volunteers of America Musically and thematically this closing song is very much a companion piece to We Can Be Together which opens the album Now let s take a quick look at the lyrics of this opening song > We can be together > Ahhh you and me > We should be together > > We are all outlaws in the eyes of America > In order to survive we steal > Cheat lie forge fuck hide and deal > We are obscene lawless hideous dangerous dirty violent and young > > We should be together > Come on all you people standing round > Our life s too fine to let it die > We should be together > > All your private property > Is target for your enemy > And your enemy > is we > > We are forces of chaos and anarchy > Everything they say we are we are > And we are very > Proud of ourselves > > Up against the wall > Up against the wall motherfucker > Tear down the walls > Tear down the walls > > Come on now together > Get it on together > Everybody together > > We should be together > We should be together my friends > We can be together > We will be > > We must begin here and now > A new continent of earth and fire > > Tear down the walls > Tear down the walls Come on now getting higher and higher > Tear down the walls > Won t you try The words on their own don t seem terribly substantial In fact they seem to neither tell a story nor paint a complete picture instead they appear to be almost a collage a set of clippings that have been collected from a variety of sources and pasted together to form interesting juxtapositions The music though adds another whole dimension to the song giving it depth and bringing it alive The track begins with a stirring almost martial rhythm with drums bass guitar and piano all in sync almost physically lifting the listener and propelling them into movement Kaukonen s lead guitar enters on a strident keening note a seeming call to action The song then breaks into a softer more lyrical rhythm and melody resolving all conflicts into a sweet transcendent unity The rest of the song alternates between these two moods with both words and music creating a powerful tension between feelings and action togetherness and conflict unity and discord It is as if the band first paints a picture of the promised land of togetherness and unity but then says Ah if you want this you ll have to fight for it Once we understand this underlying dynamic of the song and feel the power of the music relentlessly pushing and pulling us from one pole to the other we realize the true genius of the lyrics for their power lies in their simplicity and transparency Almost like advertising slogans the lyrics paint simple pictures that generate predictable emotional and cognitive responses that would be entirely trite if not for their juxtaposition But the powerful theme of the song lies entirely in this juxtaposition in its ability to alternately sing the siren song of love and communal togetherness attracting us making us feel warm and soft lulling us to let down our defenses then sounding the call to action stirring us to take to the streets and take arms against our oppressors What ties these two extremes together is this very idea of being together for the togetherness that the band is advocating starts with simple physical togetherness but then expands to include a unity of action and ultimately a togetherness of opposites the lion lying down with the lamb the oppressed first freeing themselves then freeing their former oppressors from the burden of their oppression Let s look in sequential detail at how this interplay between music and lyrics plays out starting over at the beginning of the song > We can be together > Ahhh you and me > We should be together Notice that the music here is relaxed and warm and that these opening words could be about nothing more than a traditional romance between man and woman The interplay of male and female voices lends credence to this interpretation At this point the song is all soft warm invitation nothing threatening so far The music next switches to its call to arms motif and we hear the following lyrics on top of the stirring music > We are all outlaws in the eyes of America > In order to survive we steal > Cheat lie forge fuck hide and deal > We are obscene lawless hideous dangerous dirty violent and young The words also switch gears here of course painting a picture of generational conflict reminding the listeners before they got too comfortable that they are all outlaws in the eyes of America While this may sound extreme and some of the words here are meant to paint as extreme a picture as possible for emotional impact remember that at this point in time if you protested against the war in Viet Nam if you were a male with long hair if you smoked a joint from time to time if you engaged in premarital sex and certainly if you listened to a band like the Jefferson Airplane you were probably breaking one or more laws and had legitimate reason to fear governmental oversight censure and punishment The music now switches back to the loving unity motif and we hear the following words Note that these are much like the first verse we heard but now the togetherness being sought is expanded We are now clearly talking not about a single man and woman coming together but about a group of people sharing a life together and based on the and young at the end of the last verse an entire generation by implication > We should be together > Come on all you people standing round > Our life s too fine to let it die > We should be together The music switches again back to the call to arms motif and we hear the following > All your private property > Is target for your enemy > And your enemy > is we The music switches again on the last line back to the loving unity sound but now instead of more words about togetherness we hear a demonstration of it with the band all playing softly behind the vocalists who emit gentle pastoral warblings Back to the call to arms sound for the next verse with Jorma s wicked guitar sounds giving voice to the forces of chaos and anarchy > We are forces of chaos and anarchy > Everything they say we are we are > And we are very > Proud of ourselves These words serve to draw the line of demarcation even more clearly leaving no room for indecision or fence sitting This is a fundamental conflict they seem to be saying not some mere misunderstanding We re not about to change and they the older generation the government the powers in charge are not about to forgive us for it The music now switches gears again back to the loving unity sound But now instead of words about togetherness we get a very different message > Up against the wall > Up against the wall motherfucker > Tear down the walls > Tear down the walls The most beautiful four syllables in the entire song are the ones that end the second line of the verse above There are all sorts of ways one could sing that word Many would be tempted to spit it out to make it an act of violence But Grace Slick clearly enunciates each syllable somehow imbuing the term with power and grace and purpose and even love But note how far we ve come We started with togetherness between as few as two people Then we expanded the song s sense of togetherness to include an entire generation of youth Now we ve expanded it again suggesting that it is only by confronting an abuse of power that we can tear down the walls between us and finally end the conflict and achieve the ultimate state of togetherness Now it s back to the call to arms with guitarist Jorma Kaukonen spitting out some of his most apocalyptic lines suggesting that the conflict has been brought to the very gates of the castle The song now transitions to the following lyrics singing explicitly about togetherness again but for the first time doing this to the background of the call to arms sound > Come on now together > Get it on together > Everybody together Now back to the loving unity sound and the following words confidently ending by saying for the first time that we will be together > We should be together > We should be together my friends > We can be together > We will be Finally with a new sound Kantner sings briefly of the promised land looking beyond the conflict to a new continent of earth and fire Then back to the exhortation to tear down the walls heightening the tension by saying that they are getting higher as we speak then finally ending with the plea won t you try > We must begin here and now > A new continent of earth and fire > Tear down the walls > Tear down the walls Come on now getting higher and higher > Tear down the walls > Won t you try Throughout all of this there is another musical drama going on giving further meaning to the words From first to last most of the band including the incomparable Nicky Hopkins on piano plays together harmoniously occasionally bringing one member or another to the forefront but in general painting a perfect picture of musical togetherness Against this backdrop though we have Jorma Kaukonen s often strident electric guitar with tones and rhythms modified by a wah wah pedal His instrument serves two complementary functions first it is his playing that most accurately reflects the mood of the words being sung indeed one could almost hear the entire drama through his instrument without benefit of the words and second his is the most dissonant voice that challenges us to stretch our understanding of togetherness to include this sort of individualism If it were not for Jorma s guitar the sound of the song would merely be expressing some trite form of togetherness based on conformity But the electric guitar adds another human         summary: "<p>Let’s start by reviewing the lyrics, which are central to the recording. </p>\n\n<blockquote>\n\n<p>Corn in the fields.<br />\nListen to the rice when the wind blows ’cross the water…<br />\nKing Harvest has surely come. </p>\n\n<p>I work for the union,<br />\n’Cause she’s so good to me;<br />\n</p>\n</blockquote>\n", 
        content: "Let s start by reviewing the lyrics which are central to the recording > Corn in the fields > Listen to the rice when the wind blows cross the water > King Harvest has surely come > > I work for the union > Cause she s so good to me > And I m bound to come out on top > That s where she said I should be > I will hear every word the boss may say > For he s the one who hands me down my pay > Looks like this time I m gonna get to stay > I m a union man now all the way > > The smell of the leaves > From the magnolia trees in the meadow > King Harvest has surely come > > Dry summer then comes fall > Which I depend on most of all > Hey rainmaker can you hear the call > Please let these crops grow tall > Long enough I ve been up on Skid Row > And it s plain to see I ve nothing to show > I m glad to pay those union dues > Just don t judge me by my shoes > > Scarecrow and a yellow moon > Pretty soon a carnival on the edge of town > King Harvest has surely come > > Last year this time wasn t no joke > My whole barn went up in smoke > Our horse Jethro well he went mad > And I can t ever remember things being that bad > Then here comes a man with a paper and a pen > Telling us our hard times are about to end > And then if they don t give us what we like > He said Men that s when you gotta go on strike > > Corn in the fields > Listen to the rice when the wind blows cross the water > King Harvest has surely come The lyrics of the song work on many levels At one level as Robertson says in the liner notes to the remastered CD of The Band it is a song about the labor unions the quiet revolution when people went from being separated to something making them feel that they were all part of something in their livelihood Bowman 2000 At this level the words reflect one of The Band s central themes that of The Theme of Liberation|liberation from personal identity into a broader consciousness The lyrics work at another level though Let s focus for a moment on what might be called the chorus the three lines that begin and end the song and with some variation separate the verses There are some unusual elements here As Rob Bowman notes in the liner notes for the To Kingdom Come compilation the chorus is quieter than the verse which is atypical Bowman 1989 Also the song begins with these lines even though a chorus usually does not appear until after the first verse We see as well that the words to the chorus are not repeated exactly with the exception of the final line which is also the title of the song King Harvest has surely come Neither do these lines summarize or conclude the action of the verses as is the norm for a chorus Finally we note that these lines have no fixed rhyming structure which is very unusual for a popular song Instead each of these three line stanzas is almost a haiku https en wikipedia org wiki Haiku even down to the traditional observation of nature and the seasons which is characteristic of this Japanese poetic form Given all of these variations from a normal chorus form it may be better to view these lines as something else altogether To me they seem to form another song that is combined with the central one To use terms from William Blake s poetry it is as if we have a Song of Innocence intertwined with a Song of Experience The haiku like stanzas present the innocent perspective focusing on simple sensual experiences of nature the sound of the wind the smell of the magnolia leaves the vision of a yellow moon And then the reference to King Harvest a seemingly mythical symbol of the power of nature All of these images work at a very simple primitive level of consciousness referring to timeless aspects of the natural world This effect is reinforced by the music These three lines begin with simple unadorned hushed vocals emphasizing the simplicity and naturalness of the images When Levon Helm sings Listen to the rice when the wind blows cross the water we are waiting expecting to hear something Then Levon Helm responds with a quiet repeated slightly rising tapping of his cymbal mixed with Garth Hudson s slowly emerging swirling organ The sounds and rhythms are natural ones like the wind blowing through the trees or cicadas on a summer evening audio king harvest corn mp3 Listen to the difference though when the band makes the transition to the verse Nothing is simple or natural The drums hold everything together but the guitar organ and vocals all seem to be fighting each other straining under some heavy load One organ line stops and starts playing off the beat keeping the listener off balance Robertson s guitar crackles while Manuel is singing and also between his lines competing for attention Richard hesitates in his delivery of the vocals again as if under some stress lagging a bit behind the beat Another organ line quietly builds in the background during the first half of the verse with long sustained chords in defiance of everything else going on The musical message is clear undercutting the hopeful optimism of the words in the first verse there are powerful conflicts at work audio king harvest verse1a mp3 This underlying tension apparent only in the music of the first verse emerges into the level of the lyrics on the second verse Drought threatens the singer s crops and he ends up living on skid row The third verse completes the drama leading up to the singer s enlistment in the union with his barn burning and the loss of his horse By this time Helm is no longer just keeping the beat but raining sharp blows against his drums in increasing intensity audio king harvest verse3b mp3 The stark contrast between the two perspectives is complete In clear opposition to the simple natural beauty depicted in the chorus like refrains we have the imperfection conflict and defeat of actual life The tension between the two is unresolved and irreconcilable Manuel s vocal disappears from the last verse and Robertson s guitar takes center stage His quiet instrument alternates between lyric beauty and stinging sharp rhythmic attacks perfectly representing the push and pull of the two states the continuing tension between them audio king harvest guitar mp3 Robertson s solo here is a perfect example of the type of playing he describes in talking with Rob Bowman > This was the new way of dealing with the guitar for me this very subtle playing leaving out a lot of stuff and just waiting until the last second and then playing the thing in just the nick of time It was an approach to playing where it s so delicate It s the opposite of the in your face guitar playing that I used to do This was the kind of thing that was slippery It was like you have to hold your breath while playing these kinds of solos You can t breathe or you ll throw yourself off Bowman 1989 This recording is a tremendous work of art When The Band s recordings were first released they astonished the rock world with the strength of their ensemble playing While many bands were experimenting with jazz like solos and improvisation The Band reminded everyone of the true rock aesthetic with compact recordings formed by a balanced interlacing of instruments each member playing a part in the overall composition but no one player out in front The result as in this case was high art dense and rich with every sonic brush stroke playing a deliberate part in the overall effect"
