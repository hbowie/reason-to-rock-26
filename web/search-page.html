    { 
        title: "Robert Johnson", 
        date: "", 
        url: "robert-johnson.html", 
        summary: "<section id=\"section-for-his-life\">\n\n<h2 id=\"his-life\">His Life</h2>\n\n<p>Robert Johnson was a black delta bluesman, born in 1911, dead at the age of 27, in 1938. His guitar skills developed quickly, and he mastered many of the blues styles of his day. </p>\n\n</section>\n", 
        content: " include quotebiblio I copied Johnson s words down His Life Robert Johnson was a black delta bluesman born in 1911 dead at the age of 27 in 1938 His guitar skills developed quickly and he mastered many of the blues styles of his day It is possible that his early death was caused by poison administered by a jealous husband His Recordings While Johnson s rapid development and early tragic death are the stuff of blues legend in many ways his recorded work has had an entirely different and much more interesting life of its own His entire recorded legacy consists of 42 recordings of 29 songs laid down at two different recording sessions in 1936 and 1937 Some of these recordings were released soon after they were made and were moderately successful selling a few thousand copies The first modern compilation of his work was released as an album by Columbia Records in 1961 King of the Delta Blues Singers The emergence of this collection had a huge impact on a developing generation of rock musicians on both sides of the Atlantic including Bob Dylan Eric Clapton the Rolling Stones and others A second album was released in 1970 By this time many of those influenced by his first album had risen to stardom had recorded his material most successfully Crossroads by The Cream and were trying to educate their listeners on some of the roots of the music they were playing Again the timing couldn t have been more perfect The album sold in the hundreds of thousands and college radio stations all across the country were calling Columbia Records trying to arrange interviews with this new hit artist who had by now been dead in an unknown grave for some 32 years A complete two CD box set was released in 1990 with expectations of modest sales The package sold over a million units the first blues recordings ever to do so In 2004 Eric Clapton released a tribute CD consisting entirely of Robert Johnson compositions called Me and Mr Johnson His Influence Robert Johnson s music had nothing to do with rock n roll had little influence on the development of the blues but had a sizable impact on the development of rock For white teenagers listening to the blues in the early sixties there was often a sense of eavesdropping on fragments of conversation being held by others Recordings were brief samples of what could be heard more fully in live performances small windows onto larger scenes tokens of an entire foreign culture that existed outside of the listener s normal circle There was another entirely different quality to Johnson s recordings These were not messages sent between different members of the same culture accidentally intercepted by someone outside Johnson was speaking from his culture through a medium used by his culture but he seemed to be speaking directly to the listener It was as if an actor on a stage suddenly turned looked directly into the audience and spoke directly to you conveying not just a line in the play but a message indicating some intimate knowledge of you as a person So while Johnson was clearly a product of his time and place what he had to say was no more limited to the American deep South of the early 20th century than Shakespeare s work was primarily about Elizabethan England This impact was amplified by the various accidents associated with Johnson s legacy Here was an artist from another time and place communicating directly and effectively with listeners decades later across an ocean in some cases simply through his recordings There was literally nothing left of Johnson but a record or two and yet those were enough So if one wanted to convey to a new generation of musical artists the importance of a few minutes of vinyl no more effective campaign could have been contrived Interestingly the release of Johnson s first album in 1961 failed to impress many blues experts In many ways his work was clearly derivative and their judgment was that he had failed to contribute much of his own to the development of the music But what impressed others like Dylan and Clapton were not the individual elements of his craft that he had learned from others but the way he used these to structure his songs Each recorded track was a small masterwork with lyrics vocals and guitar all working together for a unified artistic effect The effect was stunning Here were songs recorded thirty years earlier under primitive conditions by a man no one had heard of a man who had apparently left no mark on the world These were recordings that had no right to interest anyone but a few dedicated blues enthusiasts and then only as a species of archaeological rarity and yet when listening to them this man Johnson leapt from the grooves and stood before you like some holographic marvel an image so real you would swear you could see his chest rising and falling For young musicians just learning their craft these albums of Johnson s were like stone tablets handed down from a mountain top messages from some higher sphere For these mere children pursuing some still shadowy barely sensed dreams Johnson s music seemed proof that this land they envisioned must actually exist for here were relics that were obviously not of this world but tokens of some other If one needed proof that a guitar was more than wood and string that a song was more than notes and words and that a man could be more than a name and a few faded pictures then Robert Johnson s recordings were all one could ask for Track Analysis + Come On In My Kitchen"
    }, 
    { 
        title: "Chuck Berry", 
        date: "", 
        url: "chuck-berry.html", 
        summary: "<p>Of all the early rockers, Chuck Berry was by far the most significant. He was really the first artist to exhibit many of the traits that would come to define the form. </p>\n\n<p>First, he featured his own electric guitar prominently in his music. </p>", 
        content: "Of all the early rockers Chuck Berry was by far the most significant He was really the first artist to exhibit many of the traits that would come to define the form First he featured his own electric guitar prominently in his music He used the instrument to give his material a propulsive driving rhythm underneath his vocals and then used equally rhythmic lead parts to echo and accent his vocals This presaged the overall importance of guitars and guitarists in the idiom Next he exhibited the highest degree of musical integrity Not only did he play guitar on all of his recordings he wrote and sang all of his own material The result is the most satisfying and consistent recorded canon of any of the early rockers Others like Buddy Holly and Elvis Presley frequently relied on outside sources to supply their songs The results were often uneven with some of the best performances seeming to happen despite the supplied material and not because of it Much like Bo Diddley Chuck Berry developed a unique songwriting style that prominently featured his own talents on guitar Diddley developed a shave and a haircut two bits rhythm that proved repetitive and inflexible over the long haul Berry s style on the other hand while still unmistakable proved to be much more flexible ultimately being used for dozens of songs many of which have proven to be enduring rock classics As good as Berry s music was however his lyrics proved just as ground breaking Sterling Morrison member of the group Velvet Underground said I liked Chuck Berry as a guitar player But I liked him better as a lyricist There was a lot more depth there and the rhythm of his lyrics was fabulous Peel Slowly and See|Fricke 1995 While the lyrics of other early rock songs continued pop traditions of endless variations on obvious romantic themes or at best simply reflected current popular culture Berry s words transcended and commented on the youth culture he was addressing usually in a comic way Memphis for example starts as a traditional country song sung by a man trying to connect with a girl he is missing It is only in the last two lines of the song that he finally reveals that the girl he is trying to contact is his six year old daughter Other songs dealt with the frustrations of being at the mercy of adults as with Too Much Monkey Business Berry often wrote about cars and their role in youthful relationships as in Maybellene and No Particular Place to Go Berry was one of the first as well to write about the music that he and others were creating Rock n Roll Music and Roll Over Beethoven were two of his classics on this theme He was also one of the first to observe the ability of the music to liberate those who played it from their humble beginnings as in his triumphant Johnny B Goode This combination of great music and words resulted in Chuck Berry easily becoming the rock songwriter who has most frequently had his songs covered by other rockers Artists as divergent as Buddy Holly the Beatles the Rolling Stones the Grateful Dead and the Beach Boys all recorded Chuck Berry tunes to name just a few Track Analysis + School Day"
    }, 
    { 
        title: "Phil Spector", 
        date: "", 
        url: "phil-spector.html", 
        summary: "<p>Phil Spector was the most famous and influential producer in the history of rock music. He was known for producing a distinctive “wall of sound,” in which a number of instruments are blended together to create a single effect. </p>", 
        content: "Phil Spector was the most famous and influential producer in the history of rock music He was known for producing a distinctive wall of sound in which a number of instruments are blended together to create a single effect Because of this technique Spector resisted the introduction of stereo preferring to have the sounds of multiple instruments mixed together in a single monaural track rather than separated into left and right channels Spector expanded the role of a producer He owned and operated his own record company co wrote most of the material recorded under his supervision selected the primary artists and supporting musicians for each session and then orchestrated all of this talent to produce a unique artistic vision As practiced by Spector the role of producer was more akin to that of a director in film He was really the only record producer to fully claim the role of auteur the primary creative and organizing force behind the music that he produced Listen to how Hal Blaine his favorite session drummer described working with Spector > Phil is the greatest director in the world He had a way of holding you He treated the musicians like race horses Don t play yet Don t play yet He would rehearse the guitar player for an hour He would rehearse the bass fiddles He d rehearse the band Everybody play but Hal don t play I m getting a sound here Then he would say Hal play now In the booth it was like charades He would say Watch me and you d read his lips He would give you an easy easy and then he would give you a Go crazy Weinberg closing bibliography html weinberg Spector also exemplified the power of collaboration He relied on favorite singers and other supporting artists to give form to his works much as Hollywood directors would rely on favorite actors and other creative personnel working behind the scenes Again let s see what Hal Blaine has to say on the subject > I ve always maintained that one guy doesn t make a record Phil Spector alone never made a great record He made great records with all these people Brother Julius the little black man who used to clean up he was part of that recording scene Brother Julius must have been sixty five or seventy years old he d sweep up the studio at Gold Star Brother J We d give him money all the time He used to come in and make suggestions like Hey Mr Spector you sure is doing it Hey Hal git those drums bigger Weinberg closing bibliography html weinberg Spector recordings featured the talents of Leon Russell on piano Jack Nitzsche as arranger Hal Blaine on drums and Glen Campbell on guitar just to name a few who went on to achieve some degree of fame and fortune later in their careers Track Analysis + Christmas Baby Please Come Home"
    }, 
    { 
        title: "Bob Dylan", 
        date: "", 
        url: "bob-dylan.html", 
        summary: "<p>More than any other rock artist, Bob Dylan was a poet with a guitar. While the music came first for many groups, Dylan was first and foremost a wordsmith. </p>", 
        content: "More than any other rock artist Bob Dylan was a poet with a guitar While the music came first for many groups Dylan was first and foremost a wordsmith He helped open up the form to a broader range of subject matter and to more daring and imaginative use of wordplay Thanks to Dylan other singer songwriters were able to follow the path that he had blazed and find appreciative audiences for their own works Yet none surpassed Dylan in the breadth and artistry of their lyrics The song form allowed Dylan to use modern surrealistic imagery and tackle thoroughly up to date themes and subjects yet take advantage of all the traditional poetic devices that were actually out of favor with modern poets In terms of the sound of his poetry Dylan was a thorough traditionalist Rather than deconstructing poetry as did modern and post modern poets he got maximum mileage from the traditional vehicles of meter rhyme verse and chorus Any number of his songs for example used a simple repeating verse structure often with many more than the minimal three verses each verse ending with the same phrase usually the title of the song Take the following middle three verses from his song Leopard Skin Pill Box Hat > Well you look so pretty in it > Honey can I jump on it sometime > Yes I just wanna see > If it s really that expensive kind > You know it balances on your head > Just like a mattress balances > On a bottle of wine > Your brand new leopard skin pill box hat > Well if you wanna see the sun rise > Honey I know where > We ll go out and see it sometime > We ll both just sit there and stare > Me with my belt > Wrapped around my head > And you just sittin there > In your brand new leopard skin pill box hat > Well I asked the doctor if I could see you > It s bad for your health he said > Yes I disobeyed his orders > I came to see you but I found him there instead > You know I don t mind him > Cheatin on me but I sure > Wish he d take that off his head > Your brand new leopard skin pill box hat Notice the rhyming structure the ends of the second fourth and seventh lines rhyme approximately with the first third fifth and sixth lines unrhymed The first four lines form a consistent pattern The sixth line frustrates that pattern delaying the rhyme until the end of the seventh The effect is to focus the listener s attention on the seventh line waiting expectantly for the closure of the rhyme Now let s look at how Dylan uses this rhyming pattern First he establishes a larger structure ending each verse with the phrase leopard skin pill box hat Each verse tells its own compact little story all with the same characters of Dylan and his fashion conscious girlfriend but each with its own minor characters and unusual events The seventh line the one with attention focused on it by the delayed rhyme invariably carries the punch line of the story describing some increasingly unlikely appearance of the hat Every punch line manages to begin a sentence totally unlike all the others except that each always ends with the same reference to the hat By virtue of this reference appearing in the same place each time the listener begins to anticipate it thus further concentrating the impact of the punch line since we know where it is headed Using very traditional song structures such as these Dylan tackled an amazing range of subjects with a dazzling array of words He spoke convincingly to modern ethical issues of religion war poverty and discrimination His best songs used a sort of surrealistic imagery that like all great art revealed the essence of people and events around him while almost totally avoiding the surfaces that people usually observe His more personal songs spoke revealingly of human relationships exposing the diversity of motivation involved in the simplest of human acts and the difficulty of finding anything approaching an objective truth when dealing with the bewildering complexity of human thoughts and emotions He also exposed the layers of deception separating us from one another and making the simplest human connection an almost impossible task As an example take this fragment from One Of Us Must Know Sooner Or Later > I didn t mean to treat you so bad > You shouldn t take it so personal > I didn t mean to make you so sad > You just happened to be there that s all > When I saw you say goodbye to your friend and smile > I thought that it was well understood > That you d be comin back in a little while > I didn t know that you were sayin goodbye for good > But sooner or later one of us must know > You just did what you re supposed to do > Sooner or later one of us must know > That I really did try to get close to you > I couldn t see what you could show me > Your scarf had kept your mouth well hid > I couldn t see how you could know me > But you said you knew me and I believed you did > When you whispered in my ear > And asked me if I was leavin with you or her > I didn t realize just what I did hear > I didn t realize how young you were What has happened here Who has hurt whom And by doing what We are given almost no objective details no traditional story in the sense of a sequence of events Instead there are a series of observations and comments all suggesting a number of misunderstandings missed opportunities and veiled intentions People sometimes say that Dylan s songs are confusing and even incomprehensible but these people are missing the point Dylan can be clear and precise when he wants to be In songs like these Dylan was painting a picture of a modern landscape in which life itself is confusing and often incomprehensible with romance sex and friendship appearing and disappearing like phantasms in a dream Dylan was the artist primarily responsible for bringing two strong separate influences into the form of rock music poetry and folk music Unlike other rock composers Dylan was familiar with modern poets such as Allen Ginsberg and was responsible for enlarging the form of rock by bringing these influences into play As with the poetic tradition the folk tradition also included an emphasis on the importance of the words and on an admirable breadth of subject matter Perhaps more importantly though folk music demonstrated a way to fuse this subject matter with the song form and with a sense of dramatic interpretation As Dylan grew to prominence in folk music he began by singing folks songs that were standards and eventually drew critical appreciation for his commanding performance and interpretation of these songs that were also performed by many others When he began performing with rock accompaniment his recordings benefited from this ability to use song structures and his voice as a dramatic instrument to amplify and refine the impact of his works As a songwriter Dylan used music in the same way he used traditional poetic devices as a master craftsman getting maximum mileage out of all the tools available to him Dylan started in the folk tradition later exploring and expanding the possibilities of rock then later turning to country Dylan seemed able to work with almost any musicians adapting his voice songs guitar and harmonica to the surrounding environment with apparent ease His live recordings give evidence that he regularly varied the accompaniment and arrangements of his songs almost as a challenge to keep his own performances fresh playing what were originally folk songs with rock arrangements and vice versa Dylan s curse has been that his artistry has been so great and so attuned to emergent thoughts and feelings in the culture around him that he has often been treated as a prophet rather than an artist The difference is significant The artist makes us aware of implicit conflicts and by sharpening our perceptions grants us the gift of choice He does not offer us easy answers as to what those choices should be if easy answers were available then there would be no need for art A prophet on the other hand tells of things to come predicts outcomes and by implication tells us how we should act By treating Dylan s art as prophecy even Dylan s closest companions as well as the media and his audience have maligned his art So instead of simple appreciation for the enduring appeal of his greatest works Dylan has been routinely confronted by questions about what his works mean what he and the world will or should do next why his works became anthems for a generation and why despite their appeal his works have not had a greater positive influence on society and what he intends to do about it It is unfortunate for us and for Dylan that his admirers have looked to him for these answers rather than to themselves Track Analysis + Like A Rolling Stone"
    }, 
    { 
        title: "The Beatles", 
        date: "", 
        url: "the-beatles.html", 
        summary: "<p>The Beatles were to rock music what Louis Armstrong was to jazz. Both artists began by studying and thoroughly assimilating artists that had come before. </p>", 
        content: "The Beatles were to rock music what Louis Armstrong was to jazz Both artists began by studying and thoroughly assimilating artists that had come before By doing so they essentially created their respective art forms by combining what had previously been isolated characteristics of individual artists into cohesive approaches to music And they both went on to symbolize and advance their respective art forms having such monumental influences that it would be impossible for any later artists to be untouched by their work The Beatles began by studying a broad set of musical influences including early Rock and Roll Blues Rhythm Blues Country Western girl groups Phil Spector s Wall of Sound and Broadway show tunes They went on to exemplify and solidify all of the aesthetic elements of rock music discussed in this book First on the list of The Beatles many talents were the songwriting skills of Lennon and McCartney Unlike most of their contemporaries they were not content to simply throw three chords together and cobble together a melody They took the songwriting craft very seriously and as a result their compositions were often covered by other recording artists in vocal and instrumental forms Their songs were varied with each effort standing on its own as a unique achievement Next on the list of their gifts were their voices John and Paul both had wonderful singing voices expressive controlled flexible and attractive But all four of them could sing to some degree and their harmonies and multi layered vocals were hallmarks of their style Again as with their compositions the uses they made of their vocals were many and varied with differing arrangements on every song The Beatles also had a seminal bonding between the group s members As Ringo recalls include quotebiblio Just four guys who really loved each other This closeness had practical benefits for their art It allowed them to work together intimately stepping outside of their roles as individual songwriters singers and musicians to come together as a cohesive whole Perhaps their strongest talent especially in the context of a rock aesthetic was their ability to find the perfect expression of each song in the studio While many rock groups took a loose bluesy improvisational approach to their music the Beatles took a more formal structured approach to their recordings Every element of a track was worked out to perfectly blend with and complement the other elements of the song In this sense they were like painters Every sound on a track was like a brush stroke placed on canvas by a master existing for its own sake but also for its relationship to all the other components of the work ultimately achieving a perfectly balanced whole The Beatles were probably the rock group that best captured the spatial nature of rock music its existence in two dimensions length and depth Every musical element was perfectly formed and positioned as part of this two dimensional landscape As Paul McCartney commented in a recent interview after re listening to the Beatles hits that made up the 1 compilation The main thing I thought as a craftsman was how well structured the songs were that there was nothing that shouldn t have been on them and you couldn t have put one extra thing on TV Guide|McCartney 2001 The easiest way to understand this element of their art is to listen to practically any recording of a Lennon and McCartney tune recorded by someone else and then compare it to the original recording released by The Beatles Other recordings retain the beauty of the original compositions yet no matter how well intentioned sound flat by comparison This is because they are missing an entire dimension of the original recording the drumming the bass patterns the rhythm guitar the vocal arrangements For The Beatles these other elements were not mere window dressing not just ornamentation added to the underlying composition these were essential elements of their art In this regard Ringo and George while not prolific songwriters or frequent singers were essential to The Beatles music Both were versatile musicians in that they were able to play in whatever style best supported the material being recorded subsuming their personal styles into the demands of the work at hand At the same time they both had keen abilities to add something unique and wonderful to each song adding to and complementing the other musical elements Another element that contributed to the Beatles music was their awareness of a broader expanse of artistic endeavor John had gone to art school and produced writings and drawings The Beatles often attracted and hung out with artists and students As Paul indicates below art was part of who they were include quotebiblio Slightly studenty Finally what also separated The Beatles from many of their lesser contemporaries was a relentless desire for discovery and experimentation They were never content to stop at a particular plateau and set up camp as soon as they had explored a new territory they were ready to push on to something new They were the Lewis and Clark of rock music forever wanting to find new frontiers Having heaped all this praise on the Fab Four I need to also point out a few of their limitations First their lyrics were neither deep nor subtle As lyricists they were skilled artisans but lacked inspiration Yet this was not a critical failing in the context of their other artistic ambitions More than perhaps any other serious rock artist their message was in their music If their lyrics were mostly just endless variations on the ups and downs of love then this was because the underlying theme of their music was the importance of attraction of strong positive feelings of love in the broadest sense This theme was visible in their relationships to each other to their fans and to their music Another limitation was their lack of any real feel for jazz or for instrumental virtuosity in general As they progressed beyond simple rock and roll they became increasingly dependent on George Martin their producer and classically trained musicians orchestrated by Martin to augment their musical palette Yet again this was not a critical limitation given the nature of their aesthetic goals While in other groups an instrumental solo might be valued on its own merits as an interesting unusual or talented musical display within the context of The Beatles each musical part had value only for its relationship to the whole as part of the larger artistic effort And for this purpose the musical talents of The Beatles were more than adequate The evolution of The Beatles recorded output from 1963 to 1969 not only gave focus and meaning to this particular group s musical efforts but to all of rock music Because of their unequaled commercial cultural and aesthetic stature they were able to act as leaders for the rock community during their recording career While this evolution resulted in distinct differences between recordings produced at different phases of their career each phase has its own virtues and almost all of their recorded work is worth repeated listening It should be noted that British album releases during the Beatles career were often different from their American releases in terms of how the tracks were packaged into records On the British releases the Beatles music was released on a combination of singles EPs and LPs with little to no duplication In contrast the American releases included no EPs and tracks released as singles were generally included in albums as well When the Beatles catalog was released on CD and later on streaming services the British packaging was used as the model since this was the truest to the group s original intentions Track Analysis + Rain"
    }, 
    { 
        title: "Buffalo Springfield", 
        date: "", 
        url: "buffalo-springfield.html", 
        summary: "<p>Buffalo Springfield was one of the seminal American groups of the late sixties. In Neil Young, Stephen Stills and Richie Furay the group had three talented singers, songwriters and guitarists. </p>", 
        content: " include quotebiblio One of the few times I cried Buffalo Springfield was one of the seminal American groups of the late sixties In Neil Young Stephen Stills and Richie Furay the group had three talented singers songwriters and guitarists They brought folk and country backgrounds along with them and integrated these influences into a powerful and cohesive rock sound One of the best things about Buffalo Springfield was the sheer variety that they managed to embrace in their recordings Stills Young and Furay all contributed compositions to their albums Young turned out to be one of the most original expressive and enigmatic lyricists of his generation and was already contributing mature and impressive songs on the group s first album Stills was also an accomplished and wide ranging songwriter although his lyrics were simpler more straightforward and less personal than Young s Richie Furay s compositions began to be included on the group s second album and he contributed yet another perspective with his sensitive and soulful lyrics The group also had a wide variety of singing voices to choose from Furay had a pleasant sounding voice Stills voice could be gravelly at times and Young s voice was as distinctive as his lyrics Dewey Martin also contributed occasional vocals While the three songwriters tended to take lead vocals on their own compositions the group wasn t bound to this arrangement and some of the greatest pleasures of the Springfield catalog are found in Neil Young compositions sung by other band members The voices of Stills and Furay give Neil s songs an entirely different feel from ones recorded with Young s own distinctive but limited voice The group was also skilled at combining these various voices in ways that seemed influenced by The Beatles but richer in terms of vocal variety Buffalo Springfield was also blessed to have two distinctive stylists playing lead guitars in the persons of Stills and Young Stills style was more lyrical and he often made use of the wah wah pedal Young s style was rougher and more abrasive While both were distinctive they complemented each other and again broadened the collective range of the band The group s sound also featured frequent acoustic guitars as well as piano and occasional other instruments As a recording unit the band brought all these contributions together in varying combinations resulting in a sound that was somehow cohesive yet different on every track The result was fresh sounding intelligent and very American It is unfortunate that Buffalo Springfield was a few years ahead of its time When they started playing and recording together Beatlemania was still sweeping the land and the main outlets for promotion of a new band were top 40 AM radio stations and teen magazines more interested in band members favorite colors than in their musical influences It is a reflection of the times that Stephen Stills was reputedly bitterly disappointed to be denied a chance at membership in the Monkees due partially to his lack of a properly telegenic appearance For What It s Worth The Story of Buffalo Springfield|Furay 1997 Although they had a minor hit with For What It s Worth which caused them to add it hastily to a revised version of their debut album most of their individual tracks lacked the narrow focus and immediate impact necessary for success on radio stations of the day The band broke up with only three albums to their credit released in just a year and a half A couple of years later many of the band s members would enjoy more commercial success as parts of other groups including Crosby Stills and Nash and sometimes Young Poco and Loggins Messina Also ironically their post breakup collection Retrospective Best of Buffalo Springfield sold well and received a great deal of airplay on FM stations that by this time were playing album cuts not available as singles While it is unlikely that this volatile mixture of disparate talents would have lasted long in the best of circumstances some commercial success and recognition for their talents would have certainly made it easier for them While much of Buffalo Springfield s legacy can be heard on a variety of anthologies including the Neil Young collection Decade I recommend purchasing all three of the group s original albums There is a lot of variety present and there is not a track in the bunch that I don t enjoy hearing repeatedly Track Analysis + For What It s Worth"
    }, 
    { 
        title: "Jimi Hendrix", 
        date: "", 
        url: "jimi-hendrix.html", 
        summary: "<p>Jimi Hendrix was the single most inventive electric guitarist in rock. He did more to extend the reach of the instrument than anyone else of his generation. </p>", 
        content: "Jimi Hendrix was the single most inventive electric guitarist in rock He did more to extend the reach of the instrument than anyone else of his generation He single handedly demolished traditional definitions of music by playing and recording sounds made with his guitar that defied transposition or even explanation One of the best examples of these effects is his playing of The Star Spangled Banner in which he essentially deconstructs the original composition and rebuilds it as a showcase for his guitar prowess using his instrument to sonically illustrate the action taking place in the song Realizing the potential of the recording studio Hendrix built his own with the most modern equipment available at the time He consciously used this device to achieve effects not possible in concert His recordings frequently feature unusual uses of the stereo channels for instance with instruments and sounds apparently moving from left to right and back again Hendrix spent a great deal of time in the studio trying to perfect his musical visions Hendrix put his unique studio and guitar effects to good use in music that consistently sought to liberate his listeners from conventional modes of perception and expand their awareness Songs like Stone Free and If 6 Was 9 established a stance of defiant individuality and an accompanying refusal to conform to society s expectations Anyone who did not live through the fifties and early sixties might have a hard time realizing the significance of these recordings but this was a time when rigid conformity to narrow codes of dress and behavior were taken for granted throughout almost all of American society Although Hendrix attitude and musical style were new and innovative his approach to collaboration was very rooted in the blues and rhythm and blues traditions He worked most often in the trio format with a minimum of other musicians He was the lead singer songwriter and featured instrumentalist on his recordings much in the style of a Robert Johnson or a Chuck Berry It is unfortunate that Hendrix got a chance to record only a handful of studio albums before dying at a young age from an entirely accidental overdose of sleeping pills We will sadly never know how his music would have evolved and matured in later stages of his career Unfortunately complicated legal wrangling over the rights to Hendrix estate has at times impinged upon his artistic legacy A visit to the official Jimi Hendrix web site for example exposes readers to press releases about law suits being brought against various parties for their use of Hendrix images etc Track Analysis + All Along The Watchtower"
    }, 
    { 
        title: "Cream", 
        date: "", 
        url: "cream.html", 
        summary: "<p>To begin with, Cream, as its name boasted, consisted of three of the top musicians in the UK in the late sixties. Eric Clapton had established his mastery of the electric blues guitar with the Yardbirds and John Mayall. </p>", 
        content: "To begin with Cream as its name boasted consisted of three of the top musicians in the UK in the late sixties Eric Clapton had established his mastery of the electric blues guitar with the Yardbirds and John Mayall Jack Bruce was the most inventive bass player around Ginger Baker was a demon on drums specializing in a kit that boasted two bass drums While Clapton was mostly a student of the blues Bruce and Baker were at least as influenced by jazz Their live shows relied heavily on improvisation and included long jam sessions on many numbers While the musicianship of the band s three members tell much of the story concerning their live performances their studio work is another tale altogether Probably no other rock band in history had such a strong dichotomy between their two modes of expression As live performers they were the definitive power trio Much of their concert work was recorded and released with great commercial and critical success The compositions used were often old and rearranged blues classics such as Robert Johnson s Crossroads Howlin Wolf s Sitting On Top of the World and Willie Dixon s Spoonful combined with a few self penned numbers such as Toad In all these cases though the songs used were simply launching pads for the trio s improvisational gymnastics In the studio though they became an entirely different proposition Engineer Tom Dowd and producer Felix Pappalardi were significant contributors to the group s sound with Pappalardi co composing and playing viola piano and mellotron on some of their tracks Dowd was a great contributor to their sound on record and was responsible for editing a longer live performance into the fairly concise version of Crossroads that became a hit single Their sometimes startlingly original compositions were co penned by a variety of contributors most importantly poet Pete Brown but also including illustrator Martin Sharp Gail Collins the afore mentioned Pappalardi and Beatle George Harrison This unusual combination of talent was capable of producing all sorts of different sounds in the studio but what emerged most often and with greatest success was a sort of psychedelic blues Cream was also very much a product of a unique point in time starting as they did in 1966 and continuing through 1969 Older British bands such as the Beatles the Rolling Stones and the Kinks were not doing American tours at this time for various reasons creating a vacuum in the American market Previous tours had relied on older amplifiers even after the bands began playing huge venues such as stadiums making the music less important than the appearance of the bands Cream was one of the first groups to use the newer Marshall amplifiers on the road and thus was able to produce an overwhelming sound in the largest of halls even with only three musicians on stage Dylan had just opened up the Top 40 to meaningfully vague lyrics and longer songs Jimi Hendrix had introduced the possibilities of a power trio featuring a wildly improvisational guitarist Hendrix had also demonstrated the possibilities of electronically distorted guitar sounds extending the definition of psychedelia using new tools such as the wah wah pedal So in many ways Cream was in the right place at the right time to be able to take advantage of all these new possibilities Although Cream stayed together for only two years and long enough to produce three and a half studio albums this group still has the distinction of being the only band to feature the talents of Eric Clapton for this long a run And given their perfect timing and the accelerated pace of activity in the rock world during this period they were able to be enormously productive and influential over this relatively brief span Track Analysis + White Room"
    }, 
    { 
        title: "The Rolling Stones", 
        date: "", 
        url: "the-rolling-stones.html", 
        summary: "<p>In general, The Rolling Stones were the antithesis to The Beatles. Where The Beatles avoided controversy and any reference to class distinctions, the Rolling Stones reveled in them. </p>", 
        content: "In general The Rolling Stones were the antithesis to The Beatles Where The Beatles avoided controversy and any reference to class distinctions the Rolling Stones reveled in them Where The Beatles group name was inspired by the rock n roll of Buddy Holly and the Crickets The Rolling Stones took their name from a blues song by Muddy Waters In terms of musical influences their point of intersection was Chuck Berry Where The Beatles sang Let It Be The Rolling Stones sang Let It Bleed The Stones often played the role of the bad boys in rock They were willing to sing about subjects otherwise considered taboo drugs sex dominance submission in sexual relationships and violence to name a few Yet one must be careful in interpreting their work for they often played this role with differing and sometimes overlapping intentions At times they simply wanted to honestly explore a subject not otherwise discussed In other songs they wanted to draw attention to society s confusion between evil imagined and real between arbitrary social conventions and real ethical principles In many cases they wanted to use the energy of such subjects to inspire their music And in some cases they simply seemed to be living up or down to people s expectations of them At their best the role of the Stones was to test the boundaries of the liberation so freely promised by rock Were drugs OK They not only sang about drug use but paid the price for such use very publicly with the loss of Brian Jones and the near loss of Keith Richards Was flirting with violence OK They sang about it until a public killing took place right in front of the stage where they were singing at the Altamont Speedway in California Musically the best material from the early Stones resulted from the sweet and sour combination of Brian Jones eclectic musical touches and the raw blues of Mick Jagger and Keith Richards A cut like Under My Thumb is a perfect example with Brian Jones playing marimbas and acting as a perfect foil for Jagger s vocals and Richards guitar After Jones untimely death the role he once played more or less single handedly adding color and variety to the group s musical palette was filled by a variety of session musicians The group s search for another guitarist led them to use young player Mick Taylor on a few albums When Taylor decided to leave the group replaced him with Ron Wood a seasoned British guitarist more of the same vintage and musical disposition as the rest of the band Track Analysis + Sympathy For The Devil"
    }, 
    { 
        title: "Traffic", 
        date: "", 
        url: "traffic.html", 
        summary: "<p>In many ways, the original Traffic was a sort of British counterpart to Buffalo Springfield. </p>", 
        content: "In many ways the original Traffic was a sort of British counterpart to Buffalo Springfield Both groups got together in 1967 both released three albums both titled their third albums to intentionally be their last both enjoyed multiple singer songwriters both had talented multi instrumentalists both of whom were named Steve both made excellent music and both had members who went on to greater fame and fortune as parts of super groups You can read the details about Buffalo Springfield on their page In the case of Traffic their third album was entitled Last Exit The original group consisted of Dave Mason on vocals and guitar Steve Winwood on vocals keyboards guitars and bass guitar Chris Wood on flute and saxophone and Jim Capaldi on drums Dave Mason composed songs on his own while Winwood Wood and Capaldi often collaborated with each other on their compositions Mason and Winwood both sang lead vocals generally on their respective compositions As with Buffalo Springfield Traffic had an abundance of talent and this was reflected on their albums especially their self titled second one Listeners enjoyed lots of variety in style and pacing of the songs vocals and instrumentation Unfortunately as with Buffalo Springfield there was not enough cohesion to keep all this talent together for more than a few albums Dave Mason struck out on his own much like Neil Young with the Springfield Winwood left briefly to become part of Blind Faith along with Eric Clapton and Ginger Baker 2 3 of Cream The group eventually reformed without Dave Mason and continued to record and tour under the Traffic name but never with the original group s same richness of talent It was a stretch for the three remaining original band members to compose enough quality material for each album Partly in order to compensate for this deficiency the group evolved a recording style that included lots of loose jazzy improvisation and eventually included other players so that they could duplicate this sound on stage While the best of this material was pretty good it was never quite as much fun as their original work The original configuration of Traffic had a unique sound The group lived communally in a cottage in Berkshire England and the resulting music reflected this democratic spirit of collaboration The band s oft expressed motto was to sound like the same group but never to sound the same and they generally succeeded in this ambition Lyrically they were innovative Their first three albums had the notable distinction of not containing a single cut that could be mistaken for a love song Instead they sang about failed relationships Feelin Alright dream like allegories Forty Thousand Headmen and the foibles of their contemporaries Medicated Goo Every composition was distinctive and their recordings were equally creative Like The Beatles the group had a sense of spatial composition while recording They had the courage to leave enough space in their music to contain abundant instrumental coloring Their unusual instrumentation relying heavily on Winwood s organ and Wood s flute gave their recordings a jazzy sound yet the music was always in support of the song and never simply there to impress or to fill out the track Although I ve compared them to Buffalo Springfield they were also like The Band in their ability to use a variety of unusual instruments their focus on making each track a unique recording and their insistence on fashioning each track around the particular characteristics of a specific song The group was not afraid to sound quirky or idiosyncratic and while this resulted in some dispensable nonsense on their first album it also gave them the freedom to express an unusually broad range of feelings and images The group s first two albums benefited from the production talents of Jimmy Miller who was also working with such notables as The Rolling Stones rolling stones html during this same period and with equal success Miller had a wonderful talent for layering instruments on a recording in such a way that each could be clearly and distinctly heard yet complementing each other so as to make the whole much greater than the sum of the parts His production strengths were a perfect match for the instrumental abilities of the group Track Analysis + You Can All Join In"
    }, 
    { 
        title: "Jefferson Airplane", 
        date: "", 
        url: "jefferson-airplane.html", 
        summary: "<p>Jefferson Airplane was, in many important ways, the ultimate rock band. </p>\n\n<p>They were, first of all, a cohesive creative unit, a group that was truly more than the sum of its many talented parts. </p>", 
        content: " include quotebiblio Grinnell College Homecoming dance Jefferson Airplane was in many important ways the ultimate rock band They were first of all a cohesive creative unit a group that was truly more than the sum of its many talented parts The band had a distinctive identity and its band members worked together both in the studio and during live performances to create unique artistic works Their home was in San Francisco and they were both influenced by and influenced the rock scene that formed there in the late sixties making this city the epicenter of the rock movement during this period Many other notable bands came from this place at this time including the Grateful Dead and this was also the home of Ken Kesey and his Merry Pranksters immortalized in Tom Wolfe s book The Electric Kool Aid Acid Test the city that gave birth to Rolling Stone magazine and the location of the famed Fillmore West a concert venue operated by Bill Graham The Airplane was one of the first rock bands to include a woman and in Grace Slick they had a woman who was physically attractive intelligent assertive and outspoken and a full artistic equal to the men In other words Slick was not there because she was a pretty face or because she had a pretty voice or because she was romantically involved with one of the male band members she was truly a member of the band because of who she was and because the Airplane could not have been the group that they were without her At a time when many all male bands were still very openly chauvinistic this was a huge accomplishment and one that enabled the Airplane to deliver a message of liberation from traditional gender based roles for both men and women The group included multiple strong and distinctive songwriters including Marty Balin Paul Kantner Grace Slick and Jorma Kaukonen Lyrically they were more influenced by the folk tradition than by blues or pop which gave them the advantage of seeing their songs as having a broad range of thematic possibilities They also had multiple vocalists multiple lead vocalists and beautiful trademark harmonies Slick s vocals in particular were distinctive with a voice that was icy yet powerful and an ability to improvise vocally both on record and in live performances The group successfully produced Top 40 hits most notably White Rabbit and Somebody to Love and while both tracks succeeded on AM radio s own terms they also stretched the envelope of what was acceptable to such a format with the first song very overtly recommending the use of psychedelic drugs and the second one being a sort of hard hitting militant love song not about the sweetly saccharine joys of romantic love but about the desperate urgency of the human need for love At the same time the Airplane produced some of the most artistically successful rock albums and many songs that became staples of the FM radio playlists that featured longer more artistically adventurous tracks than those that fit the more restrictive format of AM radio The band also delivered some of the most powerful live performances in rock history with singers and instrumentalists improvising adventurously yet still preserving the essential and distinctive natures of the songs in their repertoire Bassist Jack Casady and lead guitarist Jorma Kaukonen were two of the best and most distinctive instrumentalists of their generation on their respective axes adding yet another powerful dimension to the group s sound Casady played a driving dynamic rumbling bass while Kaukonen played a psychedelic blues influenced lead guitar that also managed to sound exotically nordic What does that sound like Picture frozen banshees howling across arctic fjords And Spencer Dryden s drumming was both propulsive and ornamental driving the songs along when he needed to supplying quiet color in the background when anything more would have been intrusive or heavy handed The name of the band in retrospect reveals a great deal in terms of their core values Jefferson of course whether one thinks of Blind Lemon or Thomas is a particularly American name and one that establishes a link with traditions of the past Airplane on the other hand is a symbol of modern technological liberation literally freeing humankind from the gravitational pull that has bound us to the surface of the earth for so many centuries And the combination reveals the group s love for unlikely combinations of words and ideas sometimes revealing itself in playful whimsey and sometimes in thought provoking insights When looking back at the sixties it is often difficult to find accurate and lasting musical testaments to the cultural unrest that was so much a part of these times Many of the songs that retain some counter cultural flavor now seem either terribly dated terribly shallow or terribly disposable Almost alone among their contemporaries the Airplane produced a body of work whose thematic center was genuinely revolutionary not in a narrow political sense but in a way that was targeted squarely at producing an upheaval of sentiment and sensibilities and yet also a body of work that still sounds fresh and relevant and powerful almost five decades later Bruce Springsteen has said that Elvis Presley liberated our bodies and Bob Dylan liberated our minds Perhaps Jefferson Airplane s greatest contribution was its unrivaled ability to advance human liberation on both these fronts and more and in fact to accept nothing less than the liberation of human beings as integrated wholes whose bodies and minds thoughts and feelings loves and passions individuality and community could never be separated or devalued As with many rock bands that were generously endowed with talent in time some of the members felt artistically constrained by the need to shoehorn their musical tastes into the sounds of a collective and many of the band members went their separate ways Kaukonen and Casady formed a band named Hot Tuna that focused more on blues and instrumental prowess while the Jefferson Starship became a vehicle for Balin Slick and Kantner"
    }, 
    { 
        title: "The Band", 
        date: "", 
        url: "the-band.html", 
        summary: "<p>The Band hit the ground running when they started their independent recording career in 1968. They had already played for years as a backup band for Canadian rocker Ronnie Hawkins, and had performed for a while on their own, as Levon and the Hawks. </p>", 
        content: "The Band hit the ground running when they started their independent recording career in 1968 They had already played for years as a backup band for Canadian rocker Ronnie Hawkins and had performed for a while on their own as Levon and the Hawks Among musicians they were considered at the time to be the best live band around It was this reputation that earned them the invitation to play behind Bob Dylan on his first tour featuring electric guitars and full rock instrumentation When they began recording as an independent group they were on retainer to serve as Dylan s backup band whenever he wanted them This arrangement gave them the freedom for the first time in their lives to relax and write music of their own The music they began producing was like no other Their standard instrumental line up included two keyboards piano and organ in addition to the usual electric guitar electric bass and drums Garth Hudson was a wizard on the organ coaxing sounds from his instrument that had never been heard before Robbie Robertson was an acknowledged master of electric guitar but after playing loud solos for years his approach on The Band s recorded work was more subtle and refined Except for Robertson all of the Band s members played multiple instruments so accordion saxophone trumpet tuba mouth harp violin and mandolin all graced their recordings in addition to their usual instruments The Band s lyrics were also unusual Levon Helm grew up in Arkansas while the other Band members were all Canadian so they lacked the American big city perspectives of New York Los Angeles or San Francisco Their words were devoid of rebellion against an older generation protest about any facet of current affairs or any suggestions of drug use Instead their songs were about characters from the country and often from the past Their lyrics were obviously influenced by their work with Bob Dylan but Robertson acknowledges other influences as well from other narrative forms > I was just as much influenced by Luis Bu ntilde uel http en wikipedia org wiki Luis Bunuel or John Ford http en wikipedia org wiki John Ford or Akira Kurosawa http en wikipedia org wiki Kurosawa I got this hunger for education and knowledge because I hadn t gone to school since I started with Ronnie Hawkins when I was sixteen So I started to read a whole lot and I started to see these kinds of films I got into all kinds of mythologies European Nordic it influenced me in a style of story telling bowman 1989|Bowman 1989 Also of note was their singing Three of the five sang and they often sang together and traded off on lead vocals sometimes on a single song While all three Levon Helm Richard Manuel and Rick Danko had distinctive voices they also seemed to come from the same mold rough hewn with country accents Their vocals combined the natural speaking shouting feel of the blues with the harmonies of old country music All of these various talents were carefully balanced to produce their recordings Rather than having a single characteristic sound they chose the best instruments voices and styles for each song crafting a unique gem with each track Robbie Robertson remembers that the group was after a particular sound for each of their songs > the song is becoming the thing the mood is becoming the thing Up to this point I ve been harping on Bob Dylan on everybody about this sound and I don t mean electronic trick sounds All of that plays a part but there s a vibe to certain records a quality whether it s a Motown thing or a Sun records thing or a Phil Spector thing Bob was saying Who cares about that I m only interested in the lyrics Well that s not the way I felt about it at all bowman 1989|Bowman 1989 It is interesting to note that Robertson refers to certain sounds that were characteristic of certain producers or studios yet in the context of The Band s work he is talking about choosing the right sound for each of their songs This is clear evidence of rock s use of Recordings as Creative Input|recorded work as input to the creative process and of rock s ability to use other s recordings as a palette of effects that can be applied as needed Drummer Levon Helm remembers it this way We would start working on a tune and the song would dictate who would sing it and who would play supporting roles The Big Beat Conversations with Rock s Great Drummers|Weinberg It is unfortunate that the group only produced two albums of consistent quality After that dissension within the group financial disputes management problems substance abuse and lack of personal discipline prevented them from again achieving the ideal conditions that had produced their two masterpieces Their later albums still included some notable achievements with individual tracks however Although it may seem that The Band had little to do with the usual rock theme of liberation in truth they were much about liberation from individual identity At their best they were able to transcend their individual musical personas in order to achieve an unrivaled cohesion as a group In a similar way they sang convincingly about American characters of all sorts losing themselves in the lives and stories that surrounded them The inner photo of The Band from their first album represents this condition visually with the group surrounded by their families including parents grandparents and children so that the musicians themselves become nearly lost in the crowd Track Analysis + King Harvest Has Surely Come"

    { 
        title: "Come On In My Kitchen", 
        date: "", 
        url: "come-on-in-my-kitchen.html", 
        summary: "<p>This song is a great example of Johnson’s craft. Let’s look at the seemingly simple lyrics. </p>\n\n<blockquote>\n\n<p>Mmm mmm mmm mmm mmm mmm mmm mmm mmm mmm mmm…  <br />\nMmm mmm mmm mmm mmm mmm mmm mmm mmm.  <br />\nYou better come on in my kitchen:  <br />\n</p>\n</blockquote>\n", 
        content: "This song is a great example of Johnson s craft Let s look at the seemingly simple lyrics > Mmm mmm mmm mmm mmm mmm mmm mmm mmm mmm mmm > Mmm mmm mmm mmm mmm mmm mmm mmm mmm > You better come on in my kitchen > Babe it s goin to be rainin outdoors > > Ah the woman I love took from my best friend > Some joker got lucky stole her back again > You better come on in my kitchen > Baby it s goin to be rainin outdoors > > Oh ah she s gone I know she won t come back > I ve taken the last nickel out of her nation sack > You better come on in my kitchen > Babe it s goin to be rainin outdoors > > Oh can t you hear that wind howl > Oh can t you hear that wind howl > You better come on in my kitchen > Babe it s goin to be rainin outdoors > > When a woman gets in trouble everybody throws her down > Lookin for her good friend none can be found > You better come on in my kitchen > Baby it s goin to be rainin outdoors > > Winter time s comin it s gon to be slow > You can t make the winter babe that s dry long so > You better come on in my kitchen > Cause it s goin to be rainin outdoors Now let s listen to Johnson s first delivery of the chorus to get a feel for the tone of the music audio come on in my kitchen johnson1 mp3 Note that the pace of the song is slow and measured the tone of Johnson s delivery is deeply felt and the accompanying guitar is delicate even if stinging at times So whereas the lines that he sings could be interpreted to be suggestive or leering or sexually assertive his delivery conveys none of this Johnson begins the song by humming the first two lines of the first verse This does a couple of things it allows him to suggest a depth of feeling that is not yet associated with any particular characters or events and it allows the repeated refrain to be delivered as the first words of the song placing the thematic emphasis on the refrain rather than the events described later The events of the song are not quite connected enough to form a linear story Instead they seem to describe a condition The women in the song go from one situation to another one liaison to another with little or no power or resources of their own no lasting relationships no security At its most narrow this could be the condition of black women in the American South in the early 1900 s but there are no details in the song other than what we know about the singer himself to restrict our focus this narrowly Certainly the song could easily be considered to be about the fate of women in any age and any society The refrain itself is wonderful in its simplicity and its resonance What is the singer offering Certainly in the context of the song one does not expect that the offer is being made out of pure generosity or sympathy for the woman s condition yet the fact that no strings are overtly attached leaves the offer mysterious open ended And the line It s going to be raining outdoors is rich with symbolism and drama suggesting that the woman will need protection from the elements will need a relationship with the singer Two lines in the middle of the song are softly spoken rather than sung when Johnson asks Oh can t you hear the wind howl then uses his guitar to evoke the sound of the approaching storm The effect again is to dramatize the plight of the woman who has no place to stay no protection It is important to note that while the words of the song are tremendously simple this simplicity is not constrictive but rather suggestive It is not that Johnson has little to say but that he has suggested so much with so few words With a few bold lines he has drawn a simple sketch yet one that clearly outlines a world of shifting and uncertain relationships a world of setbacks and disappointments a world that cares little for the plight of a single woman and yet a world that also includes this offer of protection this open door into the singer s kitchen The notes of the song rise and fall pausing and then moving on fittingly representing the circumstances of the woman s life Johnson s voice is rich and moving with his guitar lines fitting like a glove to a hand supporting and extending his vocals suggesting a delicate frailty Note too that while Johnson s vocals are emotional the emotions are much more than simple transient reactions to a single person in a particular time place and situation they are deeply felt filled with ancient wisdom sadness and power as Dylan says of Johnson Neither forlorn or hopeless or shackled Chronicles Volume 1 It is interesting to see how much variation Johnson uses in this simple song structure He hums the first two lines Later on in the song he speaks two lines instead of singing them And when singing Lookin for her good friend none can be found note how he varies his accompaniment using his guitar to match the vocal melody seemingly emphasizing the sadness of the song audio come on in my kitchen johnson2 mp3 Just for fun let s see if we can find some echoes of this simple Johnson song in later works of rock music John Lennon uses the weather and a similarly simple set of words to describe a universal condition in Rain Dylan uses an approaching storm and a similarly open ended dramatic situation in All Along the Watchtower Dylan uses a similarly simple refrain based on the weather in Blowing in the Wind and A Hard Rain s A Gonna Fall And the tone of Johnson towards the woman in this song seems similar to the tone of Dylan towards a woman in hardship in Like A Rolling Stone Like many of Johnson s tracks Come On In My Kitchen is a masterwork in which words vocals and guitar parts are all perfectly crafted to deliver a single unified artistic effect Those who followed him would spend hours days weeks and months surrounded by sophisticated recording equipment trying to achieve similar effects emulating this almost unknown bluesman whose only opportunities for immortality were a few hours in makeshift recording studios hastily set up in hotel rooms Yet those few hours were enough for Johnson to alter the course of music decades later As one of his students admitted include quotebiblio If I hadn t heard the Robert Johnson record when I did"

    { 
        title: "School Day", 
        date: "", 
        url: "school-day.html", 
        summary: "<p>In this song, Berry recounts the events of a typical day in school. The first verse gets the protagonist out of bed and into class, and manages to summarize the tension of working for good grades and competing with peers. </p>", 
        content: "In this song Berry recounts the events of a typical day in school The first verse gets the protagonist out of bed and into class and manages to summarize the tension of working for good grades and competing with peers > Up in the morning and out to school > The teacher is teaching the Golden Rule > American History and Practical Math > You re studying hard and hoping to pass > Working your fingers right down to the bone > And the guy behind you won t leave you alone The second verse goes on to describe the rushed crowded experience of the lunchroom followed by more classes in the afternoon The third verse finally provides release getting our hero out of school and down the street into the local juke joint The fourth verse describes the experience of listening and dancing to the rock and roll available from the juke box The instrumental break that follows features Berry s lead guitar which serves to dramatize the scene just described The fifth and final verse explicitly describes the liberating power of rock music > Hail hail rock and roll > Deliver me from the days of old > Long live rock and roll > The beat of the drums loud and bold > Rock rock rock and roll > The feeling is there body and soul This songs works on a number of different levels all complementary First it offers a slice of American teenage life in the late fifties A wealth of detailed observation serves the song well in this regard the sharp glimpses of the school day the movement down the halls and into the street the local juke joint where you could select your favorite tunes and dance to them with your best girl all these and more are carefully depicted The song also works as a direct expression of rock s grand theme of liberation The first two verses describe the oppression of the school day being subject to authority working hard at the study of subjects that seem to have no intrinsic interest the regimented schedule of classes with no more than a brief interlude for lunch the competition with the jostling crowd at the school The next two verses offer release from all these constraints Soon as three o clock rolls around you finally lay your burden down The scene at the juke joint is joyful and energetic in stark contrast to the school day In particular there is contrast between the rigid structure of the school routine and the emotional freedom offered by the rock music and its associated environment hearing something really hot feeling the music from head to toe and making romance with the one you love Finally the song pays direct homage to rock music as a liberating force saying that by being loud and bold the music can deliver us from the days of old And what are we being liberated to The feeling is there body and soul So we can see that this brief rock song encapsulates the mission of rock music as a liberating force freeing a generation from a value system that places structure discipline and rote learning at the top of its pyramid and releasing it to a new world dominated by passion and feeling Put another way the movement is from an experience based primarily on the head to a whole body experience that includes the heart and soul as well as the mind I ve focused on the lyrics so far but the music is just as good and entirely supports the themes conveyed by the words Berry s guitar opens the song repeating the same chord as rapidly as a jack hammer or the sound of an alarm going off audio school day opening guitar mp3 Then he delivers the first line with a swooping note sliding upwards perfectly paralleling the movement of the words U u up in the morning and out to school audio school day up in the morning mp3 To fully appreciate the first line of the song you need to compare it to the first line of the last verse Hail hail rock and roll Note that for ostensibly the same melody you have only five syllables in the last verse and a total of nine in the first This is not just a matter of convenience or sloppiness the crowded syllables in the first verse perfectly represent the hectic day at school while the clean and graceful melody of the last verse represents the unfettered freedom offered by rock music Another way to appreciate the magnitude of Berry s musical achievement in this song is to try to imagine Frank Sinatra singing its first line U u up in the morning and out to school The image simply doesn t work This is some indication that Berry really has delivered us from the days of old There is an entirely new musical sensibility at work here In place of the subtle melodies and lilting swing of the past generation we have the staccato percussive attack of rock n roll expressed through Berry s guitar as well as his vocals The structure of the song is worth mention as well There is no repeated chorus at the end of each verse Berry easily sacrifices this pop convention seemingly in order to make room for a couple of extra verses Neither is there a bridge Both of these mechanisms usually are employed to add melodic novelty in order to keep the listener s interest and to prevent the repetitive structure of the verses from becoming too monotonous But Berry has no need of these devices here First the lyrics are simply too good and the movement of the song too strong for the effort to become boring But more to the point musically Berry subtly varies the melody from verse to verse adding extra syllables at time as already noted He also uses his guitar to echo and comment on each vocal line and the variations here are more than enough to hold the listener s interest In place of the bridge he has an instrumental break featuring his guitar Given the theme of the song Berry s rocking guitar solo works perfectly setting words to action and playing something really hot letting the listener feel the music in addition to understanding the words audio school day guitar break mp3 It is impossible to overstate Berry s achievement on this recording In retrospect many components of early rock and roll and indeed of all popular art seem to consist of historical happenstance and cultural artifacts Musical style A meets style B and style C is produced Fleeting hair and clothing styles are immortalized in song The music seems to be a product of its time and place rather than of an individual artist or group of particular individuals Imagine for a moment that we could separate this one recording from its cultural and economic surroundings Take away Buddy Holly Elvis Presley and all the rest Erase the fact of this song s success on the Top Ten Forget bobby sox tight jeans and blue suede shoes Even if all we had was this one recording of Chuck Berry s we would have ample evidence of art and artist Look deeply at this one track and you find an act of conscious creation expressing a unique artistic vision belonging to a particular individual As Berry said in another song Roll over Beethoven and tell Tchaikovsky the news"
