    { 
        title: "New Forms of Collaboration", 
        date: "", 
        url: "new-forms-of-collaboration.html", 
        summary: "<p>Artistic collaboration has been a key issue for rock music, as with the other major twentieth century art forms, film and jazz. </p>", 
        content: " include quotebiblio Maybe the rhythm section could run the band Artistic collaboration has been a key issue for rock music as with the other major twentieth century art forms film and jazz Through the end of the fifties the early rock n rollers had used traditional patterns of collaboration As in the blues and country western there was usually a front man who was a combination of singer and band leader surrounded by instrumentalists and backup singers Buddy Holly Chuck Berry Elvis Presley Jerry Lee Lewis Little Richard and others all fell into this familiar pattern Starting with Phil Spector though rock musicians began to experiment with new more complex forms of artistic interaction Armed with the ability to create music in the studio rather than simply record it there Spector was among the first to elevate the role of record producer to the status of auteur orchestrating the work of songwriters singers musicians and recording engineers to realize a unique artistic vision The Beatles were among the first to pioneer another new collaborative arrangement a group of relative equals all sharing creative responsibility and working together synergistically thus elevating the group as a whole to the status of auteur This new working arrangement was signaled first by the group s name Although their artistic identity was inspired somewhat by the name of Buddy Holly s band the Crickets they chose not to single out any single member of their group as a front man So in contrast to Buddy Holly and the Crickets they were simply The Beatles This collaborative relationship was also reflected in their public image Unlike any musical group before or since they were commonly identified by radio disk jockeys with their string of first names as in Now here s the latest hit record from John Paul George and Ringo This means of identifying the group reflected their image in the public s eye All four had distinct personalities John witty and slightly roguish Paul warm and fun loving George silent and thoughtful Ringo insecure and something of a loner Yet despite being four unique individuals they looked and acted as a cohesive group starting with their signature haircuts and aided initially by matching clothes This unique public presentation was part of their charm But the presentation was a reflection of their underlying working relationship and this was the biggest part of their enduring artistic success John Lennon recalls the decision he had to make when choosing other members of his fledgling rock group include quotebiblio We went for the strongest format As this quotation shows John made a conscious decision to sacrifice individual prominence in order to achieve greater artistic strength The Beatles and other rock groups that followed discovered a way to create music together in such a way that the whole was greater than the sum of its parts At their best these groups tapped into the strongest creative talents of each member and brought their contributions together into a cohesive whole Ringo recalls what it was like to perform as part of such a group include quotebiblio We seemed to have telepathy include quotebiblio Recording solo projects In a later quotation Ringo also commented on the fragility of such interaction include quotebiblio With us four it was magical Having a group of creative equals working together enhanced both phases of the artistic process generation of ideas and editing When recording a song the Beatles had four separate minds coming up with ideas None of them restricted themselves to a single instrument or fixed role all of them came up with ideas for the others to sing and play as well as themselves But all of these ideas had to be approved by four minds as well If something didn t sound right to one of them then they would rework it or replace it with something else until all the pieces were just right The tale of the formation of Buffalo Springfield is another mythic example of the power of the rock group Neil Young and Steve Stills had met before on the East coast but had parted ways Both were attracted to something in the other and had been trying to contact each other for some time without success Finally they met when their cars passed each other on Sunset Boulevard and Steve or one of his companions recognized the distinctive hearse that Neil was driving in those days As recounted in Richie Furay s remembrance below what finally cemented the bond was the work that Steve and Richie had done on a song of Neil s include quotebiblio Nowadays Clancy Can t Even Sing What a seminal story Neil who already had the ability to write songs play guitar and sing was blown away by the ability of two others to add to his creation in a way that Neil alone could not And so another great rock group was formed this one with multiple singers multiple songwriters and multiple guitarists Once again technical achievements had an important role to play in rock The ability to work together in this new way was only made possible by supporting advances in technology To have a group of creative equals is only possible with a relatively small group of musicians Three four or five members seemed to be the maximum possible With larger numbers of musicians the coordination and play of egos were too difficult and the structure of the group tended to revert back to that of a frontman accompanied by sidemen Even groups of five tended to be unstable and tended to result in the eventual exclusion of one of the members as with Brian Jones and the Rolling Stones It was only the combination of electronic amplification and the ability to assemble a finished track in the recording studio though that gave such small groups the ability to create compelling and complex music Amplification gave such groups the ability to be as loud as they wanted letting them play to audiences in the largest concert halls and amphitheaters But it was the recording studio that ultimately provided the freedom for small groups to create large complex pieces of music without having to write formal arrangements and thus without sacrificing the spontaneity and urgency of music created directly by the players themselves Four band members could lay down a basic recording with minimal instrumentation and with each voice and instrument recorded on a separate track They could then overdub other parts layering on top of or even replacing the original recording In this way four musicians could produce tracks with many more than four parts This form of collaboration with the group as a creative unit was so successful that it became the predominant pattern of collaboration for rock during the sixties To work together in this way of course required a group of sympathetic individual artists The individual members of a group had to agree on the basic goals and artistic values of the group as a whole in order to make such a creative partnership work It is important also to consider the role of the producer For all of their albums but one The Beatles used the same producer George Martin The Beatles owe much of their clean and classic sound on recordings to this distinguished individual Jimmy Miller produced several albums for the Rolling Stones and Traffic that are often considered their best and he contributed to the distinctive multi layered sound of these albums While few producers attempted the level of control that Phil Spector demanded in the studio many played more subtle but still important roles in collaborations that produced many great works of rock art This element of collaboration also supports rock s persistent theme of liberation In this case group collaboration offered a release from the constraints of isolation and freed rock musicians to form a new sense of community No longer were artists restricted by their individual limits and forced to work in creative separation Instead they worked as a group each retaining their individuality yet being supported by and part of a larger whole This feeling of community that started with the collaborative working arrangement I have been describing came to inform much of the lyric content and intention of later works by these artists Within each such rock group almost invariably there was another collaborative pattern at work that of the singer songwriter There was an unspoken agreement in most groups that the member who wrote the bulk of the lyrics to a song would also sing the lead vocals This only made sense since the author s understanding of the lyrics and their emotional intent made him or her best qualified to convey this intent through the vocals Other group members would then play supporting roles following the lead of the singer songwriter Note that this relationship held true in most rock groups whether they had a single lead vocalist and author of their lyrics as with the Rolling Stones or multiple singer lyricists as with the Beatles As more distinctive songwriters appeared people such as Bob Dylan Jackson Browne Joni Mitchell and Neil Young the singer songwriter began to be the dominant collaborative pattern These were people whose songs were so unique and whose output was so prolific that they did not want to share each album with other composers This shift was also supported by the change in emphasis from performing live to studio recording In order to tour you needed to have a band of regular musicians who were willing to play together night after night To record an album though you only needed a very temporary collection of supporting musicians It is important to note though that in many of these cases there were often enduring relationships between songwriters and supporting musicians even when they were not given equal billing as part of a group Bob Dylan had The Band Jackson Browne relied on guitarist and violin player David Lindley on many of his finest albums and Neil Young had a long collaborative relationship with the band called Crazy Horse Individual Expression vs Group Cohesion When a group of artists share a creative vision then the entire group can be more than the sum of its parts But when there is disagreement about creative goals then working as part of a group requires some compromise on the part of each individual The longer such compromise is required the more it can grate with the suppressed impulses of each individual artist becoming stronger until release is required In truth all rock groups have always involved at least some of both synergy and compromise so there has always been some tension between the desire for individual expression and the cohesion necessary to form a group This tension reached the breaking point in the late sixties As individual artists such as Bob Dylan and Jimi Hendrix came to the fore there was a growing pressure on other artists to prove that they could make it on their own This pressure was increased by the sentiments of the rock press at the time which focused on the contributions of individual group members partly because it was so much easier to analyze these groups by decomposing them into their constituent parts than to discuss the synergy between their members Brian Wilson it was revealed was the real genius behind the success of the Beach Boys John Lennon similarly was discussed as the prime mover within The Beatles with detailed analysis of which songs were really his and how they were so much better than Paul s Suddenly most group members were being viewed as boat anchors that were weighing down the real artists lurking within each group All of this resulted in the breaking up of many rock groups Some such as Blind Faith and Crosby Stills Nash Young stayed together long enough only to produce a single album Others such as Cream Buffalo Springfield and the original Traffic stayed together for only three or four albums The parting of ways of The Beatles was of course the most spectacular Unfortunately in every case I can think of the artistic merit of the music that came from these isolated individuals was at a level distinctively below that of their prior groups As one example of many none of the ex Beatles achieved anything on their own that matched the value of their group achievements The distinctive collaborative patterns of rock musicians proved difficult to sustain yet contributed strongly to their most enduring artistic achievements"

    { 
        title: "Electronic Amplification", 
        date: "", 
        url: "electronic-amplification.html", 
        summary: "<p>The ability to electronically amplify musical instruments was another technical advance that proved to be a key enabler of the rock aesthetic in at least three different ways. </p>", 
        content: " include quotebiblio The Electric Bass First Started to Come Around The ability to electronically amplify musical instruments was another technical advance that proved to be a key enabler of the rock aesthetic in at least three different ways The first and most obvious impact of amplification was the ability of relatively small groups of musicians to play to large audiences Traditionally it had required something the size of a symphony orchestra to fill a large concert hall The need to coordinate such large groups of musicians required a regimentation ill suited to the rock aesthetic Smaller groups of musicians had traditionally played what was called chamber music literally because they could only play to a relatively small room With electronic amplification it was physically possible for a group as small as a trio to play to the largest auditorium This technical achievement allowed relatively small musical groups with few enough members to allow improvisational collaboration on stage to reach relatively large audiences An essential contributor here was Jim Marshall whose hugely powerful amplifiers made possible the success of rock trios such as The Jimi Hendrix Experience and Cream in the late sixties The second impact of amplification was the creation of the electric bass an essential component of The Big Beat the driving rhythm of rock As noted by Levon Helm above the appearance of the electric bass guitar created a solid bottom to the sound even with a relatively small group The third impact of amplification on rock was the ability to alter the sound of its instruments In particular this ability was key to the success of the guitar as the premier instrument within rock Choice of different style of guitar solid or hollow body number of strings 6 or 12 brand of guitar Fender vs Gibson brand of strings and amplifier all dramatically affected the resulting sound Additional possibilities were offered by the whammy bar the wah wah pedal fuzz tone feedback etc Some important guitar sounds on hit records were even made possible by physically slashing the speaker cones on an amplifier The importance of this ability to vary the sonic signature of an instrument cannot be overestimated The electric guitar was the precise tool needed to realize the advantages of recording music directly rather than composing it on paper The traditional approach to music was akin to painting with crayons the available sounds were largely predetermined by the chosen instruments Given this limited palette of aural choices the paint by number approach of musical composition made some sense a composer wrote directions for a large orchestra and the resulting sound given competent musicians was largely predictable As the potential of the electric guitar was gradually realized though the approach to music shifted Giving a rock musician an electric guitar was like handing a visual artist brushes and oils when all he had before were crayons Suddenly any possible hue could be mixed from the pigments and the size and texture of the brush strokes could be varied almost infinitely Similarly whole new ranges of sounds were made possible with an electric guitar Now the ability to record the exact sound made by a musician mattered there was no standard guitar sound no standard way to play a series of notes written on paper With the magnification offered by electronic amplification what were before small variations in a guitarist s approach to a song to playing a single chord now became important artistic and stylistic elements Jimi Hendrix was the best example of this approach to the instrument After his relocation to England he went to Jim Marshall and asked for an amplifier with a certain sound In response to this request the electronics specialist designed an amp with a distinct thick tone resulting from overdrive harmonics of the valve Jimi Hendrix and the Making of Are You Experienced|Egan 2002 It was also in England that Hendrix connected with Roger Mayer a sound experimenter who created various gizmos to alter the sound of the electric guitar The two hit it off immediately and after that Hendrix had first call on all of Mayer s inventions Jimi Hendrix and the Making of Are You Experienced|Egan 2002 It is important to make a distinction here between an electric guitar and a completely electronic instrument such as a synthesizer A synthesizer can theoretically make any possible sound Given what I have said so far one might think such an instrument to be a logical successor to the electric guitar further expanding the creative potential of rock musicians In practice though very little great rock music has been made using synthesizers Key to the success of the electric guitar are the physicality of the instrument and the combination of freedom with constraints Because of the almost unlimited freedom granted by a synthesizer there is a tendency to doodle to continue to try different possibilities and to program the music rather than playing it live The result is generally head music sounds that seem disembodied and unconnected to a physical musician The electric guitar on the other hand becomes almost an extension to a rock musician s body As with all great art certain constraints are necessary to challenge the artist Part of the beauty of art is the ability to overcome such restrictions The electric guitar seemed to offer rock musicians just the right balance of new possibilities and challenging limitations Another useful comparison might be between the possibilities offered by the electric guitar in rock and cinematography in film Just as guitarists gradually explored the new freedom offered by electronic amplification cameramen realized a similar potential to vary the presentation of their subjects through use of filters backlighting varying perspectives zoom and pan shots etc In music what had been important before were the notes in drama the words In rock music the sound of the instrument took on artistic significance in film the visual presentation became as important as the words that were being spoken In rock the remaining limitations of the instrument provided artistic challenge in film the initial limitations on color to black white and shades of gray and the immutability of the subjects being filmed imposed similarly stimulating limitations In music the synthesizer offers too much freedom and not enough limitation in film arguably the modern availability of unlimited color combinations combined with computer generated graphics seem to offer too much freedom Note that in these same ways described above electronic amplification helped to realize rock s overarching theme of liberation Musicians were freed from the need to play with large groups in order to play to large audiences At the same time they were freed from many of the constraints of their acoustic instruments opening a multitude of new avenues for them to explore"
    }, 
    { 
        title: "The Big Beat", 
        date: "", 
        url: "the-big-beat.html", 
        summary: "<p>Rock music has been accused of having a beat that is at once too strong and too simplistic. </p>", 
        content: " include quotebiblio Sufficient rhythmic interest include quotebiblio What you re missing is the beat Rock music has been accused of having a beat that is at once too strong and too simplistic Let s look at these issues individually and see how they in fact contribute to the power of the music If you look at the classic instrumentation of a rock group drums bass electric guitar and piano one inescapable fact is that they are all percussive instruments There are no horns or strings no instruments that are bowed or blown whose notes smoothly move to the desired volume and then stay there The musicians play all of these instruments by striking them with a stick pick finger or hammer As a result their characteristic sounds all exhibit sharply rising and descending volumes The overall effect is to emphasize the rhythmic value of each note to give the placement of the peak volume of each note each chord at least equal weight with its melodic or harmonic element In earlier musical forms the drums bass piano and guitar had sometimes collectively been referred to as the rhythm section With rock instrumentation effectively the entire group became part of the rhythm section Part of the reason for increasing the strength of the rhythm in rock for creating what became known as the big beat was to increase the propulsive force of the music This is essentially the same reason that regular meter is used in traditional poetry In this sense rock is to traditional pop music as poetry is to prose And so Shakespeare could fairly be accused of being a proponent of the big beat The effect in both rock and metered poetry is to create regular rhythmic patterns that drive the listener along and amplify the energy of the words This is why Phil Spector told David Susskind when he was reading the lyrics of one of his songs on TV that what he was missing was the beat One effect of the strong rhythm is to increase the intensity and power of the communication Listening to rock lyrics without the beat would be akin to paraphrasing Yeats as saying Going round in larger circles the damned bird gets lost The meaning of the words is roughly the same but my phrasing has none of the power of Yeats Turning and turning in the widening gyre the falcon cannot hear the falconer Another reason for increasing the strength of the rock rhythm was simply to make the beat an equal player in the resulting music As suggested above by Robert Palmer traditional pop forms had made the beat a poor second cousin to melody and harmony Rock liberated the rhythmic component of the music allowing it an equal footing with the other elements The perception has sometimes been that the beat in rock music is so strong as to overpower the melody and lyrics making the words unintelligible for example While this has no doubt happened at times it is not an essential part of the music On the other hand ears that are used to rhythm being consistently relegated to the background sometimes perceive the beat as overpowering simply because it has been brought to the foreground The result can be disorienting because multiple musical components are all vying for equal attention in rock The effect is akin to viewing modern art in which elements of form and color are no longer subordinate to the demands of strict representation The result though is a much richer artistic experience in which multiple elements of the music thematic intent meter rhyme and alliteration vocal shadings melody harmony and rhythm are all working together Rock has also been accused of having a simplistic rhythm based on its consistent use of a 4 4 time signature with the accents on the second and fourth beats of the measure a backbeat When used at its best however this basic underlying rhythm is just the starting point for many subtle rhythmic variations After all with so many instruments all playing a part in the rhythm it is not necessary and would in fact be distracting to have the foundation time signature be calling attention to itself As Chuck Berry said in Rock and Roll Music it s got a backbeat you can t lose it The interesting part overall is not the time signature which will repeat throughout the song anyway but what you do with it the variations laid on top of it the larger reinforcing rhythms in the song structure Listen to what drummer Levon Helm has to say about the development of rock drumming include quotebiblio When D J Fontana came in Now let s look at the Phil Spector and Darlene Love song Christmas Baby Please Come Home as an example of how the big beat can function in the overall aesthetic of the song The song s intro starts with a loud beat produced by multiple instruments A bass then plays the melodic introduction Maracas or some similar percussion instrument begin to repeat regularly in the background Bells emphasizing the season are used at the end of each bass line playing two notes the second coinciding with the large sound used at the very beginning of the song The transition from the intro to the first verse is provided by pounding drums supported by other instruments gradually increasing in volume until Darlene Love launches into the first verse Keep in mind all this rhythmic action has so far occurred in the first sixteen seconds of the song Now let s look at the overall song structure which provides the largest rhythmic framework for the song I ve tried to lay it out below so that you can visually see the repeating patterns and variations within the song <table summary= Song Structure border=0 width= 100 cellspacing=4 cellpadding=4 align=center class= shaded > <tr> <th class= shaded > Verse Chorus Contents < th> <th class= shaded > Verse Chorus < th> <th class= shaded > Melody < th> < tr> <tr> <td class= shaded > 1 <br> 2 <br> 3 <br> 4 <br> < td> <td class= shaded > Intro < td> <td class= shaded > Bass < td> < tr> <tr> <td class= shaded > 1 The snow s coming down<br> 2 I m watching it fall <br> 3 Lots of people around <br> 4 Baby please come home < td> <td class= shaded > Verse < td> <td class= shaded > Vocal < td> < tr> <tr> <td class= shaded > 1 The church bells in town <br> 2 All ringing in song <br> 3 What a happy sound <br> 4 Baby please come home < td> <td class= shaded > Verse < td> <td class= shaded > Vocal < td> < tr> <tr> <td class= shaded > 1 They re singing Deck the Halls <br> 2 But it s not like Christmas at all <br> 3 Cause I remember when you were here <br> 4 And all the fun we had last year < td> <td class= shaded > Chorus < td> <td class= shaded > Vocal < td> < tr> <tr> <td class= shaded > 1 Pretty lights on the tree <br> 2 I m watching them shine <br> 3 You should be here with me <br> 4 Baby please come home < td> <td class= shaded > Verse < td> <td class= shaded > Vocal < td> < tr> <tr> <td class= shaded > 1 <br> 2 <br> 3 <br> 4 < td> <td class= shaded > Verse < td> <td class= shaded > Sax break < td> < tr> <tr> <td class= shaded > 1 They re singing Deck the Halls <br> 2 But it s not like Christmas at all <br> 3 Cause I remember when you were here <br> 4 And all the fun we had last year < td> <td class= shaded > Chorus < td> <td class= shaded > Vocal < td> < tr> <tr> <td class= shaded > 1 If there was a way <br> 2 I d hold back this tear <br> 3 But it s Christmas day <br> 3a Please Please <br> 4 Baby please come home < td> <td class= shaded > Verse < td> <td class= shaded > Vocal < td> < tr> <tr> <td class= shaded > 1 Baby please come home <br> 2 Baby please come home <br> 3 Baby please come home <br> 4 Baby please come home < td> <td class= shaded > Verse < td> <td class= shaded > Vocal piano drums < td> < tr> <tr> <td class= shaded > 1 I need you right here <br> 2 Please come home <br> fade < td> <td class= shaded > Verse < td> <td class= shaded > Vocal < td> < tr> < table> You can see the largest pattern is that of two verses followed by a chorus The verses repeat the same chord structure and melody with varying lyrics except for the fourth line which always consists of the same words with an accelerating drumbeat in the background The chorus repeats the same chord structure melody and lyrics Variations in the overall structure of verse and chorus are provided by the bass introduction the sax break taking the place of one verse and the fade out at the end of the song We have four lines in each verse and each chorus with the verses using an a b a c rhyming pattern and the chorus a more focused and intense a a b b pattern Variation in the four line structure of each verse is provided in the final verse when the insertion of a repeated accelerating call and response Please builds tension before the final appearance of the fourth line provides release Let s now zoom in a little further and look at the rhythmic patterns within each line First each line of a verse begins with the word Christmas sung by the background vocalists The maracas keep up a steady beat in the background Spector s famous wall of sound keeps up the steady pulsing backbeat of the rhythm On top of this the lead vocalist and instrumental soloists are constantly playing with the rhythm adding extra notes playing a bit ahead or behind of the strict beat The overall result is one in which the rhythmic interest is at least as strong as the melodic and harmonic interest with all three working together to advance the theme of the work"

    { 
        title: "The Unrepentant Human Voice", 
        date: "", 
        url: "the-unrepentant-human-voice.html", 
        summary: "<p>Many prior forms of music treated the human voice primarily as a musical instrument, and the singer as another musician. </p>", 
        content: "Many prior forms of music treated the human voice primarily as a musical instrument and the singer as another musician Emphasis was consequently placed on clarity of tone the ability to control the voice s volume and pitch to produce certain musical effects such as vibrato and ultimately to subjugate the voice to serve the desires of a composer arranger producer or conductor At one point in the history of European classical music boys were even castrated before their voices had changed in order to create castrati https en wikipedia org wiki Castrato possessing voices with very unique and particular qualities When microphones became available to singers for live performances in the early 1930 s it enabled a new style of singing one that no longer required a vocalist to be able to project to the back rows of a venue This led to the popularity of singers such as Rudy Vallée and Bing Crosby so called crooners who could sing in soft low voices and rely on their microphones amplification systems and speakers to convey their sentiments all the way to the back of the room This style of singing lent itself to a romantic and sometimes sentimental emotional expression mined thoroughly by stars such as Bing Crosby Frank Sinatra and Perry Como During this same period blues singers developed a broader approach to the use of their voices especially as they gained access to microphones and electric guitars In the 1950 s singers like Muddy Waters and Howlin Wolf used microphones to capture all the intimate nuances of their voices but they were moaning shouting and growling not crooning Adding to the mix other musical styles such as gospel rhythm and blues and bluegrass all contributed their own particular modes of vocalization As rock and roll emerged there were two lines of development for vocalists On the one hand singers such as Elvis Presley Roy Orbison and Buddy Holly were clearly valued for their voices whereas artists such as Chuck Berry and Bill Haley were appreciated for other reasons but not known particularly for their great voices Another stream of influence came from folk singers such as Pete Seeger and Woody Guthrie These were songwriters and activists who used their voices to tell stories In many ways their vocal performances were as much dramatic as musical providing shading and emphasis but clearly focused on the delivery of the words as much or more than the performance of the music Rock music drew on all of these influences and then went beyond them First rock bands such as The Beatles had no single singer as a front man In their case John and Paul both sang frequent lead parts with George singing harmony and occasional lead and even Ringo sometimes being given a lead vocalist role While John and Paul were both gifted and distinctive vocalists neither were particularly idolized for the sounds of their voices or for any particular mode of vocal expression If anything their gifts lay in their immense flexibility ably demonstrated in their early cover versions of songs ranging from Little Richard s Long Tall Sally to Please Mr Postman by The Marvelettes A group such as The Band took this distribution of vocal chores even further when they moved beyond the backup role they had played for singers Ronnie Hawkins and Bob Dylan Although they had multiple band members who could sing as well as play their earthy organic vocals seemed perfectly suited to their own compositions but were rarely employed and hardly seemed suitable for handling any more conventional material Secondly in addition to sometimes going beyond the singling out of a lead vocalist rock artists abandoned traditional restrictions on how the human voice could be employed as part of a musical performance As rock lyrics matured to express all aspects of being human with nothing off limits modes of vocal expression developed in parallel revealing an unrepentant human voice no longer trying to mask its humanity or hide its limitations but using all possible modes of vocal expression to express the full range of human thoughts and feelings As examples listen to Bob Dylan s Like A Rolling Stone Buffalo Springfield s For What It s Worth Sympathy for the Devil by The Rolling Stones or King Harvest by The Band But also certainly listen to performances by female artists such as Darlene Love on Christmas Baby Please Come Home Laura Nyro on Save the Country and Joni Mitchell on Chelsea Morning These are all vocal performances so uniquely wrought to match their material and expressing so many different facets of being human not just through the words and the melodies but through the unchained use of the singers voices that one can t listen to them without becoming more fully alive more deeply in touch with one s own humanity This liberated use of the human voice not just to perform vocal gymnastics but to fully express so many different lives so many different aspects of being human is a vein that runs throughout all of the best rock music"
    }, 
    { 
        title: "Artistic Basics", 
        date: "", 
        url: "artistic-basics.html", 
        summary: "<p>All great art shares certain characteristics. These are necessary traits for rock music as well, if it is to stand and be counted in the same category. </p>", 
        content: " include quotebiblio The road not taken All great art shares certain characteristics These are necessary traits for rock music as well if it is to stand and be counted in the same category Following are what I believe to be the necessary characteristics with discussions of how they apply to rock Many of these characteristics are interrelated Artistic Purpose I don t believe that the motivation to create art is ever 100 pure Artists like to eat and some even like to be comfortable And all artists desire an appreciative audience So it is not always easy to separate out a pure artistic impulse from other motivation Nonetheless it is sometimes possible to look at the artist or artists primarily responsible for a finished work and see whether they were unduly influenced by issues other than aesthetic ones It is also possible at times to look at the finished works and see whether they betray tell tale signs of motivation other than primarily artistic ones What is an artistic purpose To some extent it is reflected in a desire to please oneself to be true to one s own artistic vision An artist always seeks an audience but is unable or unwilling to pander to an audience to compromise his or her own vision simply for fame or fortune In an interview with Sean Egan Chris Stamp recalls how his independent record company assessed the marketing demographics for Jimi Hendrix first album include quotebiblio Didn t think like that The Beatles are a good example of a group that consistently stayed true to their artistic impulses Before they began writing their own songs they played songs that they genuinely liked When writing their own songs they wrote songs that they liked As you review the decisions they made during their career including their famous decision to give up touring in order to focus their efforts completely on recording and their decisions to spend months in the studio working on a single album one can see they were consistently true to an artistic purpose This is reflected even in their decision to disband based on feelings that they had done everything they could do together as The Beatles and on feelings that they wanted the freedom to pursue artistic impulses not shared by the others in the group It was for these same reasons that they steadfastly refused to re form over the years no matter how strong the pressures of fans and financial incentives The easiest contrast here is a group called The Monkees They were a corporate construct put together for purely financial reasons The members of the group no matter how well intentioned recorded songs mostly written by others and had other uncredited musicians playing the instruments at least on their first couple of albums They were designed as faux Beatles specifically to take advantage of a hunger for more musical and TV appearances than the originals could provide Individuality All great art inevitably betrays the character of the artist Lesser works often seem to be made by committee or by corporate edict expressly designed to sell to a particular audience These sorts of products often fail to show any signs of individuality partly because none was required and partly because the artisans who produced it felt no motivation to invest anything of themselves in their work When an artist s work shows individuality it is possible to see a certain consistency when looking at a body of work from that artist For example when looking at the work of The Beatles one can see a consistent interest in love friendship and feelings These interests coincide with but run deeper than the normal pop preoccupations with girl boy relationships This is in sharp contrast to the work of The Rolling Stones for example whose work consistently reveals interests in power structures including the ones that preserve class distinctions as well as the ones at work in relationships Look at the collected work of The Monkees however and what do you find Are there some deep underlying themes that connect Last Train to Clarksville Daydream Believer I m Not Your Stepping Stone and A Little Bit Me A Little Bit You Pleasant pop tunes all but there is not much consistency between them other than a bland banality A strong sense of individuality was especially important when the starting point for one s work was rooted in traditional forms Lonnie Youngblood an R B band leader with whom Hendrix had played remembers the guitarist as having different aspirations than other performers include quotebiblio Jimi was reaching for something much deeper Integrity Great artists must be true to their own muse to their own artistic vision As a result great art seems to have an internal consistency that lesser works lack Great works of art seem to hang together as a whole in which none of the pieces could be removed or altered without destroying the entire work For many rock groups issues of integrity were most evident in their ability or inability to record their own material In the passage below Paul McCartney recalls an early confrontation with George Martin the man who was to become the Beatles producer include quotebiblio Yes but it is us The temptation to compromise was a strong one for many groups Keep in mind that there was no option for these artists to spend their careers painting or writing in obscurity perhaps with the belief that their true talents would one day be recognized In order for anyone to appreciate their talent they had to have access to a recording studio The comparable situation would be a painter who could only get canvas and oils if he agreed to paint commissioned works Ringo recalls the pressure that fell on the other members of The Beatles as George Martin presented them with Mitch Murray s song include quotebiblio For that bit of plastic you would sell your soul A converse example can be seen with the early work of the British band Traffic Their first two albums provided three compositions that garnered significant airplay for other bands while Traffic themselves received little radio exposure Traffic s recordings were loose jazzy and wonderfully textured with instrumental touches coming primarily from Winwood s organ and Chris Wood s flute Heaven Is In Your Mind was recorded by Three Dog Night This version of the song capitalized on the song s interesting composition and druggy sounding lyrics but featured bland harmonies and little instrumental color Smiling Phases was recorded by Blood Sweat and Tears This track was a bit truer to the song s jazzy roots but ended up as a ponderous big band number losing the quirkiness of the original Feeling Alright by Joe Cocker was probably the best of the three cover versions The song worked well with Cocker s normal bluesy histrionics but again pales against the original which was given a low keyed reading by composer Dave Mason the understated vocals giving all the more emphasis to the quiet desperation of the lyrics In other words all three of these cover versions lacked the integrity of the original recordings Innovation All great artists seem to thrive on innovation This does not mean that they are necessarily the ones who first discovered or invented some new method or technique The person who invented the movie camera was not necessarily the one who employed it to greatest artistic effect Similarly Les Paul is widely credited as being the inventor of the electric guitar Yet his playing of this instrument is quite clean sounding very different from those who followed him on the instrument Rock histories have often placed great emphasis on who was chronologically first to employ a certain instrument or technique feedback for example or the use of a sitar on record From an aesthetic perspective the more important issue may be who made best use of a new discovery My point here is really that all great artists are restless eager to try new techniques and reluctant to repeat themselves or others Their art reveals a sense of progression of forward movement building on past successes while always trying something new new at least to the artist It may well be that this sense of innovation is more important to the artist than to the audience After all we can still appreciate art of past decades and centuries even though the techniques they employ are no longer new Yet this interest in innovation is still useful from a critical perspective if only as a sort of acid test to help determine artistic authenticity The Beatles again are a good example of innovation They began by demonstrating their mastery of most of the techniques of rock artists who came before them both with cover versions of others songs and with their own first song writing attempts They progressed to recording complete albums of their own material and developing their own very broad but distinctive style They went on to create albums that were well balanced collections of songs of different styles and sounds They explored the possibilities of using other musicians as part of their recordings expanding their artistic palette They progressed by giving up touring in order to concentrate more completely on the creative process of working in the studio They progressed further by each exploring their own more individual interests and combining these on a single collection And finally they disbanded rather than continue a recording career together that would not display any further forward movement Timelessness There is something about great art that reaches across generations that transcends the contemporary conditions from which it emerges In this context it is certainly interesting to see that The Beatles are still topping the album charts thirty some years after having disbanded most recently with their collection of hit singles titled simply 1 These albums are not simply being purchased by aging fans but also by a whole new generation Similarly there seems to be a renewed interest in Jimi Hendrix with the currently young generation of listeners It is often hard to pin point artistic attributes that contribute to this sort of timeless appeal It is sometimes easier to identify attributes that prevent a work from achieving this classic status Sometimes a song is too narrowly focused on a particular topic of vanishing interest The Rolling Stones song Mother s Little Helper succumbs to this problem being about housewives who take pills like Valium to help them get through their dreary lives The Kinks song God s Children on the other hand still succeeds today even though it was originally commissioned as part of a movie soundtrack and written as a protest against organ replacement not one would think a compelling subject for a rock song Yet Ray Davies frames his song in enduring human terms dramatizing the conflict between a simpler view of life and a brave new world in which humanity is increasingly mechanized blurring the lines between natural and man made order This desirable trait of timelessness can also be compromised by being swept up in current trends Most of The Rolling Stones album Their Satanic Majesties Request has this problem being drenched in psychedelic effects having little to do with the essence of the Stones Great art ultimately speaks to some element of the human condition that does not change over time that is as true for us today as it was the day it was written Summary Purpose individuality integrity innovation and timelessness these are all characteristics of genuine art and artist no matter what the medium As we look at great examples of rock music these artistic basics will surface time and time again"
