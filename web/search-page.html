        summary: "<p>Like many of my generation, I grew up taking rock music for granted. My interest in the form started with the first singles by the Beatles, when </p>", 
        content: " include quotebiblio No vital and significant forms of art Like many of my generation I grew up taking rock music for granted My interest in the form started with the first singles by the Beatles when I was just entering adolescence and continued through my college career and beyond Certainly much of what was popular during this period as is true for any period and any popular art form was trite and annoying But a generous portion of the rock music produced over these years was exciting energizing and liberating To be able to tap into all this energy by turning on a radio by purchasing and playing a record seemed no more miraculous than breathing It was part of the fabric of my existence As I grew older and discovered other art forms literature cinema and jazz to name those most important to me my interest in rock music abated accordingly I became aware that every generation rebels against its predecessors in matters of taste and style and suspected that the musical preferences of my youth would eventually join those that came before it one more fad that seemed all powerful when it first rolled up onto the shore but then left little trace once it had receded Over the years I have become more aware of what I would call the artistic sensation as distinct from feelings of novelty amusement or animation I can quite contentedly watch a new movie be swept up in its action and pass a couple of agreeable hours yet leave the theatre knowing that I am done with it that is has left no residue This is quite different from the feelings engendered when I watch Hitchcock s Vertigo listen to Miles Davis playing In A Silent Way read The Second Coming by W B Yeats or The Big Sleep by Raymond Chandler all of which I have had occasion to do recently No matter what the form all art seems to produce a similar sensation of timelessness of implicit order of connectedness It is as if the work of art had sounded some deep note and caused sympathetic vibration in a hidden string a string whose one end is secured in the human heart and from there ascends towards some unknowable summit the existence of the termination point affirmed only by the tautness of this resonant connection What has surprised me is that as my awareness of this artistic sensation has become more acute there is a great deal of rock music that still reliably sets it off Somewhere over the years I had lost my vinyl copy of Jesse Winchester s first album I recently became aware that it was available on CD after a decade or so of being out of print When I listened to it again for the first time in many years it sounded as fresh and new and appealing as it had when it first echoed off the walls of my dorm room in 1970 I am aware too that this music still has an enduring power to move others as well How else explain the continuing popularity of Beatles reissues the regular use of classic rock songs as themes for new television commercials and the strong sales of greatest hits compilations featuring music from this era I began work on this book almost thirty years ago just after graduating from college Some typewritten pages still remain from this effort I pick it up now from feelings of debts unpaid of assistance unacknowledged As I look back at my youth I am startled by the wealth I took for granted When I turned on my radio back then there was a good chance of hearing what I now recognize as art powerful vibrant alive It was like living in a world where paintings by Renoir or Picasso adorned the billboards beside the highways Art was being invisibly transmitted through the airwaves ready whenever it was needed at the flick of a switch Or it was pressed into vinyl available just down the street for a few dollars ready to be heard at the drop of a phonograph needle The goal of this book then is to give credit to rock music as a legitimate and autonomous art form Because rock has been a tremendously popular form of music because it is still relatively young and because it has had such an effect on our society there has been a tendency to look at the music primarily in other ways as a cultural influence as a sociological force as a popularity contest as a business or as a set of stories about the often colorful personalities of its performers Even books that have taken rock seriously have tended to focus on its influences and antecedents giving the impression that rock music is nothing more than a recent trend in an unbroken musical continuum including pop folk blues and jazz to name only a few other related forms The intent of this book in contrast is to focus on rock music as an independent art form This is not to deny of course that it shares important elements with other musical forms But just as film shares important elements with other narrative forms yet also introduces important differences I believe that rock music brings distinct elements into play elements that have generally not been sufficiently recognized I need to explain that when I talk about rock music I am using the term to refer to something larger than the genre of rock and roll or related forms like the blues I tend to reserve the phrase rock and roll to refer to music by artists like Bill Haley Little Richard Buddy Holly and Chuck Berry mostly produced in the late 1950 s In contrast rock music to me is something broader and more embracing not a specific genre but an aesthetic that makes use of contributions from the blues rock and roll and soul music as well as other musical antecedents The purpose of this book then is to establish rock music as an important art form in its own right If this work is successful then I believe that rock will be recognized as the third great art form of the twentieth century along with film and jazz Herb Bowie Scottsdale Arizona March 24 2001"

        content: "This book is divided into four sections that are meant to be read in roughly sequential order 1 Introduction This section contains chapters including this one that introduce the main theme of the book and explain how the book can be used 2 Elements The second section presents the major elements of rock music those attributes that distinguish it from other forms and that separate outstanding examples of rock artistry from lesser works 3 Artists and Tracks The other major section of the book looks at a number of great examples of rock music These are organized by artist in chronological order by the original release date of their representative tracks The intended reading sequence here is to read about one artist then about a representative track from that artist then the next artist and so on I make no claim that these are the best rock songs of all time only that they are all great examples that illustrate the combination of elements described in the preceding section In some cases you will find well known artists and songs As with many art forms though fame is often slow to catch up with artistic merit and so some selections may be considered obscure 4 Closing This final section contains some closing thoughts and reference material including a Recommended Reading list and an Epilogue containing a discussion of factors that have contributed to the decline of the rock aesthetic"

        title: "Overview",

        url: "overview.html", 
        summary: "<p><img src=\"images/elements-of-rock-music.png\" alt=\"Elements of Rock: The Big Picture\" /> </p>\n\n<p>There are two different ways to look at rock music. </p>", 
        content: " Elements of Rock The Big Picture images elements of rock music png include quotebiblio A gradual development by the boys There are two different ways to look at rock music The first is to see it as an extension of rock n roll which is to say just another style or genre within the overall form of popular music The second perspective and the one I advocate for in this book is to view rock as a separate form with its own aesthetic The relationship I propose between rock and pop music is very similar to the one now widely accepted between film and theater despite the obvious common elements what makes a good work of art in the newer form is so different that it is worth addressing separately In the case of rock music I am proposing a number of elements that together define the form Few if any of these elements are entirely unique to rock But I will argue that they had a stronger impact on rock music than on other forms and that it is only in great rock music that all or most of these elements are found to converge In brief these elements are as follows 1 Technology As depicted in the diagram above technological advances have driven many of the changes that influenced the aesthetic development of rock music 2 Poetry Plus It is a truism that simply filming a great play does not produce a great film nor would a staged version of a great film make a great play And yet the two forms undeniably share common elements dialogue acting pacing and overall dramatic structure to name but a few In a very comparable fashion lyrics to rock songs share many elements with poetry In particular great rock recordings often reflect the wide ranging subject matter and intensely personal perspective of poetry And of course rock lyrics use many of the same devices rhyme meter alliteration and so on Rock is also able to augment the lyrics with additional devices using voice and instruments to reinforce and extend the meaning of the words 3 The Theme of Liberation The overarching theme of much great rock music is that of liberation breaking free from all sorts of restraints This theme is expressed in the music as well as the words with guitars making sounds never heard before and with song structures that often go beyond the traditional verse chorus bridge pop format 4 Recordings as Input to the Creative Process To an unprecedented degree rock musicians learned from and were influenced by music that was recorded and mechanically reproduced rather than performed live in a local venue One result was the British Invasion in the early sixties which saw a whole generation of British bands assault the American airwaves armed with American blues and rock n roll recordings from which they had learned their trade 5 Recordings as Works of Art Quite naturally this generation of musicians came to view the recording and not the live performance or the musical notation of a song as their primary artistic output The sound of a particular track as captured and edited in a recording studio became more important than any characteristics that could be reproduced by the same band on stage or by other artists performing the same song 6 New Forms of Collaboration Beginning with The Beatles rock saw a new kind of artistic partnership Groups of three four or five individuals learned to work together as an artistic unit writing singing performing and producing their own material with most band members playing multiple and often shifting roles in this process Even when a single singer songwriter emerged great rock was dependent on the kind of collaboration found in film in which a number of individuals playing different roles all contributed to the artistic success of the finished work 7 Electronic Amplification The technical ability to amplify the sound of an instrument particularly a guitar was a key enabler for several other elements mentioned here Thanks to this new found power a group of musicians previously limited to volumes appropriate for chamber music could now perform to a large hall or even stadium full of listeners Electronic amplification also introduced the ability to distort and shape the sounds of the instruments through techniques such as feedback fuzz tone wah wah pedals and countless other techniques This electronic influence over the sounds of the notes provided something worth capturing on a recording something that could not be adequately described through musical notation 8 The Big Beat Rock is known for its distinctive 4 4 rhythm with a backbeat This simple foundation allowed singers and instrumentalists to lay all sorts of rhythmic variations on top Rock is also known for the strength of its beat providing much of the propulsive power of the music Together these rhythmic elements are used to convey the sense of liberation characteristic of the music and so often expressed in the lyrics as well 9 The Unrepentant Human Voice Many other forms of music required layers of artifice concerning the quality nature control and power of the human voice when used as a musical instrument Consistent with its spirit of liberation rock music consistently emphasized the humanity of its singers without any necessity for concealment artifice or shame 10 Artistic Basics All great art shares certain elements I talk about artistic purpose individuality integrity innovation and timelessness and point out how these are evident in the rock canon Let s look at each of these elements in greater detail"

d class= shaded > Fender Precision Bass created by Leo Fender < td> <td class= shaded > The electric bass became an important instrument for almost all rock music second in importance only to the electric guitar < td> < tr> <tr> <td class= shaded > 1951< td> <td class= shaded > Fender produces the Telecaster a solid body electric guitar < td> <td class= shaded > This dual pickup solid body electric guitar allows guitarists to play more loudly and allows the guitar to become a lead instrument < td> < tr> <tr> <td class= shaded > 1954< td> <td class= shaded > Fender introduces the Stratocaster a high end solid body electric guitar < td> <td class= shaded > This guitar features three pickups and other improved features and has become one of the most enduring and popular guitars used in rock music < td> < tr> <tr> <td class= shaded > 1955< td> <td class= shaded > Most home record players now capable of playing both 33 1 3 and 45 RPM records LPs and singles < td> <td class= shaded > Listeners can now enjoy at home whatever music is available on record < td> < tr> <tr> <td class= shaded > 1955< td> <td class= shaded > Throughout the mid fifties high fidelity hi fi playback equipment becomes commercially successful < td> <td class= shaded > Home listeners can now listen to music with a fidelity that rivals that of live music < td> < tr> <tr> <td class= shaded > 1958< td> <td class= shaded > Stereo records are released < td> <td class= shaded > Stereo allowed much more natural sound reproduction< td> < tr> <tr> <td class= shaded > 1958< td> <td class= shaded > Atlantic Records installs the first eight track tape recorder in its studios studios outside the US would not catch up until the mid to late sixties < td> <td class= shaded > Multitrack tape recording allowed voices and instruments to be recorded on separate tracks allowing each to be separately altered prior to being mixed down into the final two stereo tracks This allowed the artist to have a greater say in the overall sound of the recording as it was finally released < td> < tr> <tr> <td class= shaded > 1965< td> <td class= shaded > Marshall 100 watt amplifiers are produced < td> <td class= shaded > These amplifiers offered more volume allowing rock bands to play in larger halls and still be clearly heard as well as offering a more aggressive sound < td> < tr> <tr> <td class= shaded > 1967< td> <td class= shaded > Wah wah pedal is first used on rock recordings < td> <td class= shaded > The wah wah pedal and other effects boxes allowed a guitarist to alter the sound of his or her instrument in interesting ways < td> < tr> <tr> <td class= shaded > 1967< td> <td class= shaded > US Federal Communications Commission imposes a non duplication rule for FM radio stations < td> <td class= shaded > This new rule prevented owners of FM radio stations from broadcasting a duplication of programming already available on another AM station Many owners responded by quickly creating music programs in which the disk jockeys were allowed to play whatever music they wanted thus creating a radio outlet for album cuts that were otherwise too long or too uncommercial to have ever allowed them to be aired on radio FM radio became a popular distribution channel for rock music which offered increased sound quality and stereo reproduction when compared to AM radio < td> < tr> < table> The significance of all of this technology will be discussed in greater detail in later chapters"

        url: "poetry-plus.html", 
        summary: "<p>There have been past attempts to describe rock lyrics as poetry. </p>", 
        content: " include quotebiblio Poets Coming out of the Woodwork There have been past attempts to describe rock lyrics as poetry My intent is not to suggest that the words to rock songs can stand on their own and survive comparisons to great poems by Shakespeare Yeats or Whitman I have something different in mind Let me start by trying to define the essential elements of traditional poetry 1 Words That is poetry is a form of literature 2 Wide ranging subject matter Poems can express thoughts and feelings on any subject and are often used for conveying content too personal or individual for other forms 3 Compressed meaning Poems are compact They use imagery symbolism metaphor and other mechanisms to pack a great deal of substance into relatively few words 4 Sound effects Poetry uses techniques such as rhyme alliteration and meter to help shape the meaning of the words and to strengthen their impact on the listener Now let s see how these poetic elements show up in rock music Words The first point to be made is that words are absolutely central to rock music Despite the image of loud guitars pounding drums and incomprehensible vocals great rock music has always started with the lyrics Now this is not to say that the words by themselves constitute great art Nor is it to say that the words alone even express any original or unusual ideas But the other elements of rock music shape themselves around the words extending and strengthening them If you don t have words or the music is in conflict with the words then you don t have great rock music People sometimes argue that the words in rock songs can t be all that important because they are often so hard to hear Yet there is a sort of holographic quality to great art in that the message of a piece is embedded in the whole of the work Art is not a jigsaw puzzle in which you have to carefully fit together all the pieces in order to see the whole although we may sometimes dissect it in order to better understand how it works In the same way that you can cut a hologram into pieces and still see the entire three dimensional object from any of the pieces the impact of great art can be sharpened by an appreciation of the whole but the impact is not lost if there are a few words you can t understand Let s look at a few examples from other forms to further make this point Some of our best films including Howard Hawks His Girl Friday and many of Robert Altman s films were known for the way in which they overlapped dialogue having one actor starting to speak before another was done The effect can be disconcerting because the practice defies normal cinematic convention even though it is common in everyday life The initial feeling can be that you are missing something important However this is not the case While understanding all the lines can enhance an appreciation of such a film the director has not buried some vital piece of information in any of these lines In fact these are cases where the meaning of the film is as much in the pacing and timing of the dialogue as in the contents of the words themselves As another example take Picasso s famous anti war painting Guernica https en wikipedia org wiki Guernica Picasso Pick any quarter of the painting and look only at that the overall intent of the entire work is still clear Or consider the works of Shakespeare On the one hand he wrote poetry in one of the smallest forms the sonnet On the other hand he also composed entire plays in verse Yet you can consider a smaller piece of one of his plays such as Hamlet s famous To be or not to be soliloquy and still extract a sense of the overall theme from the smaller segment So if like Bob Dylan you first heard the chorus of the Beatles recording I Want To Hold Your Hand as I get high instead of I can t hide as Lennon and McCartney intended trust that the intended overall feeling of celebration and liberation were not entirely lost Subject Matter The next point is that rock music has ended up addressing almost every possible subject in its lyrics In this way rock music liberated songwriters from the relatively narrow range of content acceptable to pop and blues audiences To a great degree Bob Dylan led the way in this area initially writing protest songs about political and social issues but then transitioning to very personal subjects But once he demonstrated the possibilities others followed and the result was a flowering of lyric content As an example take the D eacute j agrave vu album by Crosby Stills Nash and Young On this one collection we find songs about passing wisdom from one generation to the next Teach Your Children the importance of nonconformity Almost Cut My Hair the inability to escape one s past Helpless the nature of the emerging counter culture Woodstock an almost suicidal expression of despair 4 + 20 and the list goes on You may disagree with or dislike some of the content but then that is somewhat the point there is enough substance there that you can disagree with it To a large extent as we will see the increased breadth of interests expressed by rock music was heavily influenced by its primary medium being Recordings as Works of Art|recordings rather than live performances Unlike live performances recordings could be listened to privately and as often as desired making the primary mode of appreciation for the art form more akin to poetry than to other musical forms Compressed Meaning In the third area of comparison that of compressed meaning we can see that rock music works in a way similar to poetry Words are used to encapsulate preserve and amplify a particular experience sensation thought or feeling In the space of a few verses and a chorus just enough is said to convey the intended meaning Many rock songs employ a narrative structure spending their few words to tell a story In these cases the story is stripped down to its bare essentials with just enough detail to make the intended point Take the beginning to Chuck Berry s classic Johnny B Goode > Deep down in Louisiana close to New Orleans > Way back up in the woods among the evergreens > There stood a log cabin made of earth and wood > Where lived a country boy named Johnny B Goode > Who never ever learned to read or write so well > But he could play a guitar just like ringing a bell Note how Berry uses every word to convey meaning to the listener The phrases deep down and way back are used to indicate the geographical remoteness of the hero s origins but also suggest the placement of his music s appeal in our collective psyche as well as the archetypal nature of the story he is about to tell The name of New Orleans is invoked to suggest the richness and depth of the musical heritage Berry is describing Log cabin indicates the humbleness of Johnny s beginnings but also gives it nobility bringing up images of our nation s origins and of great Americans such as Abraham Lincoln Evergreens again adds a note of nobility to our hero s surroundings and also suggests the ability of America s music to continuously renew itself Never ever is used as an example of Johnny s untutored grammatical constructions while the rest of the line explains why he speaks this way And then the last line comparing the naturalness of his musical ability to ringing a bell again invokes images of our country s origins reminding us perhaps of the Liberty Bell By the way if you are tempted to think that Berry s song is merely autobiographical keep in mind that he was born in St Louis and was remembered as a good student in school with a love for poetry Equally important to the success of this verse are the things not said Johnny s skin color is never specified The style of music he plays is never mentioned America is never said even though it is clear that we are talking about our nation s musical heritage Without ever directly raising issues of race Berry manages to successfully weave images of our country s Afro American musical heritage into the larger fabric of American culture That s a sizable achievement for a total of just fifty seven words and one that would take many more words to say directly in prose even assuming that the point could ever be made as clearly in another form Sound Effects The final area of comparison is what I call sound effects Rock music uses some of the same ones employed by poetry Rhyming at the end of each line is an obvious one Alliteration and meter are also used as with poetry Look at the following lines from the song Feel Flows written by Carl Wilson and Jack Rieley and recorded by the Beach Boys I ve numbered the lines to make them easier to refer to later > 1 Unbending never ending tablets of time > 2 Record all the yearning > 3 Unfearing all appearing message divine > 4 Eases the burning > 5 Whether willing witness waits at my mind > 6 Whether hope dampens memory > 7 Whether wondrous will stands tall at my side > 8 Feel flows White hot glistening shadowy flows > 9 Feel goes Black hot glistening shadowy flows Note first the unusual scheme for rhyming http en wikipedia org wiki Rhyme scheme at the ends of lines Including the chorus and ignoring the background vocals in parentheses it is ababcdeff That is the first line rhymes with the third the second with the fourth the next three don t rhyme and then the eighth line rhymes with the ninth Note also the effect of this The alternating rhymes in the first four lines establish a regular rhythm The lack of rhymes in the next three lines disrupt this pattern creating a sense of suspense as we wait for closure an effect mirrored by the meanings of the three lines all asking questions The tension is resolved by the last two lines with their startlingly simple answers and closely paced rhyming Note also the internal rhymes in the first and third lines with unbending and never ending rhyming in the first line and unfearing all appearing in the third These additional rhymes increase the flowing regularity of the first four lines The next effect I d like to look at is alliteration http en wikipedia org wiki Alliteration We have the t sound repeated in the first line with tablets of time The a sound is repeated in all appearing in the third line Lines five through seven repeat the w sound at the beginning of no less than eight of the nineteen words they contain And then of course the last two lines again ignoring the background vocals repeat the f sound at the beginning of three of their four words The effect of all this I think is to create the sensation of an almost trance like state and to give a sense of order The last of the three poetic effects I want to discuss is meter http en wikipedia org wiki Meter poetry English is a language with varying accents on different syllables and as a result poetic meter in English is based on varying patterns of stressed and unstressed accents The metric pattern most common in English is the iamb an unstressed syllable followed by a stressed syllable This is where some of the differences begin to appear between poetry and rock Accents in poetry are determined simply by the patterns present in the standard pronunciation of the words used In vocal music such as rock though there are a couple other variations First the singer can emphasize certain words by making them louder therefore changing the emphasis Second the composer or singer can break a single syllable into several notes effectively creating additional syllables or diluting the impact of a single syllable Let s look at the resulting patterns of accented and unaccented syllables in these same lines from the Beach Boys using a to indicate an unaccented and a ` an accented syllable numbered lines ` ` ` ` 1 ` ` 2 ` ` ` ` 3 ` ` 4 ` ` ` ` ` 5 ` ` ` ` 6 ` ` ` ` ` 7 8 Note that the meter in lines 5 through 7 is trochaic starting with an accented syllable and then alternating accented and unaccented Lines 1 through 4 are partially trochaic but with some extra unaccented syllables inserted which add variation and slow the pace a bit before hitting the relentless rhythms of lines 5 through 7 Lines 8 and 9 are then completely unaccented indicating the free flow spoken of by the words Where rock music differs greatly from traditional poetry is in the additional sound effects available In addition to the effects available from the words themselves there are the additional possibilities available from the vocals and instruments Here rock music was heavily influenced by the blues with its expressive vocals and instrumentals As an example listen to how D J Fontana describes his drumming on the Elvis Presley record Jailhouse Rock include quotebiblio A jailbird breaking rocks The best rock music uses the musical elements the chords the rhythms the melody the sounds of the singer s vocals the shadings of the instruments to expand and reinforce the meanings of the words In particular rock music combined the free range of vocal and instrumental expression of the blues with the wide ranging subject matter and vocabulary of traditional poetry The result was a new kind of poetry one in which all the forces available are brought to bear in service of the words being sung"

        title: "The Theme of Liberation", 
        date: "", 
        url: "the-theme-of-liberation.html", 
        summary: "<p>The theme of blues music might be stated as the human response to oppression. This is most obvious in the lyrics, which speak of the suffering and pain caused by events outside of the singer’s control. </p>", 
        content: " include quotebiblio The Sixties Revolution The theme of blues music might be stated as the human response to oppression This is most obvious in the lyrics which speak of the suffering and pain caused by events outside of the singer s control This response to oppression is also expressed in the heartfelt vocals of the singers It is even present in the form of the music itself chained as it is to a fairly rigid song structure and limited chord progressions You can see it in the structure of the lyrics in the way that an initial statement of a condition is often repeated in the second line of a verse without modification include quotebiblio Went down to the crossroads The great theme of jazz on the other hand is freedom Jazz musicians most often start with a popular song state the melody and then go on to improvise variations The musical statement is clear I can be free I can express my own personal identity even when working within the confines of a structure that is not mine Every variant note every swinging chorus every improvisational foray restates this basic theme of freedom Even when starting with a blues structure the implication is different because the song is only a point of departure As John Litweiler says in The Freedom Principle Jazz after 1958 The quest for freedom with a small f appears at the very beginning of jazz and reappears at every growing point in the music s history The Freedom Principle Jazz After 1958|Litweiler 1990 The theme of rock music as I will show is liberation release from constraints of every kind In a way then rock is positioned precisely between the blues and jazz Blues captures the state of oppression while jazz expresses the opposite state of freedom Rock does not express a fixed state at all but captures the transition the movement from one state to another the act of throwing off the chains In many ways rock music was a product of its time For the United States and many other Western nations the fifties and sixties were a period of extraordinary liberation Following on the heels of two World Wars and the Great Depression these societies were enjoying an unprecedented combination of peace and prosperity Modern industry freed many people from the demands of tough physical labor In terms of psychologist A H Maslow s hierarchy of needs https en wikipedia org wiki Maslow 27s hierarchy of needs the lower level biological and safety needs were mostly satisfied freeing up energy to pursue needs higher up the scale feelings of belonging and love self esteem self actualization learning and artistic expression The whole generation of baby boomers conceived in record numbers after the end of WW II grew up in this new era of economic and social freedom In both England and the US record numbers of students were participating in higher education in art schools or universities giving them the time and encouragement to pursue aesthetic ambitions include quotebiblio The economy of the sixties This was also a time of extraordinary sexual liberation The combination of the birth control pill with the lack of any threatening sexually transmitted diseases allowed a whole generation to enjoy the pleasures of sex without having to experience any of its normal consequences In addition to these medical advances many members of this generation had grown up with two parents and a family of siblings giving them the sense of security and belonging that allowed them to be sexually adventurous without feeling a strong need for commitment During the fifties and sixties many technical advances also imparted a sense of liberation Industrial mass production allowed many young members of society to experience a new sense of freedom and mobility through personal and public transportation Record players transistor radios television and movies made musical performers more accessible than ever before Electronic amplification of vocals and instruments allowed smaller groups to play to larger audiences and allowed skilled instrumentalists to alter the sounds produced by their instruments This was also a period of great political hope The US had survived the Cuban missile crisis President John F Kennedy brought a sense of style and youthfulness to American politics Blacks in the US were making great political gains The Viet Nam war was finally ended in part due to popular protest President Richard Nixon was forced to resign after the Watergate revelations Although there were certainly many terrible events during this time there was also a sense that right would eventually prevail that popular enlightenment could overcome political inertia and conservatism In the US racial integration was also at its peak during this period Rock and roll had started as a mixture of rhythm and blues with country and western essentially combining popular musical styles from both blacks and whites Black performers like Chuck Berry and Bo Diddley championed the new style along with white performers like Elvis Presley and Buddy Holly White performers like the Rolling Stones and Eric Clapton used their enormous popularity to bring attention to the black bluesmen who had influenced their styles At the same time most of the legal and physical barriers to racial integration were falling even in the American South One of the great benefits of this progress was the unrestrained ability of musicians to cross racial boundaries in order to work together Several bands of the sixties and early seventies were racially diverse including the Jimi Hendrix Experience Sly and the Family Stone the Paul Butterfield Blues Band Booker T and the MGs and Bruce Springsteen s E Street Band There was a sense that musicians of all colors now shared a common musical heritage Drugs also imparted a feeling of liberation to many members of society Alcohol was freely available and helped to liberate many from the squalor and violence of their surroundings as with The Beatles while they were playing in Hamburg Uppers freed musicians from the need to rest allowing them to play long sets party into the night and travel from one engagement to the next Marijuana and LSD liberated musicians from their normal thought patterns from linear thinking and from the sensory filtering that is a normal part of adult human existence In some cases as with The Beatles the experiences they had while on drugs led them to pursue Eastern spiritual paths and transcendental meditation as healthier ways of altering their consciousness There was also a dark side to drug use during this period of course including harmful addictions and many drug related deaths include quotebiblio Music and psychedelics Finally rock music itself proved to be a vehicle of liberation for practitioners of the art Strings of hit records and successful tours were able to liberate the artists from otherwise limiting economic and class restrictions Nowhere was this more true than in England where rock music actually provided the ability for commoners to achieve social recognition such as knighthood So the Queen s recent celebration of her fiftieth year on the throne was attended by Sir Paul McCartney All of these liberating influences had an effect on the evolution of rock music In many cases liberation was the explicit theme expressed in the lyrics of the songs Take this excerpt from Thunder Road by Bruce Springsteen off his Born to Run album include quotebiblio I m no hero Notice throughout the emphasis on liberation from romantic illusion the notion of trading in these wings on some wheels There are also powerful images of physical liberation of rolling down the window feeling the wind rush through your hair and heading off down the road knowing that the two lane highway just outside your door can take you literally anywhere in the world Finally there is the promise of spiritual liberation of riding out tonight to case the promised land Many of rock s best songs like this one directly express this theme of liberation of breaking free from the past from spiritual and physical restraints and pursuit of a utopian vision This sense of liberation was also present in the music that accompanied the lyrics Look at the structure of Thunder Road and you see that Springsteen was liberating himself from the traditional verse chorus bridge song structure with a much looser organization to his composition This feeling of breaking free is also present in Clarence Clemons saxophone solo on Springsteen s recording of this song Much of the best rock music has a feeling of coloring outside the lines of not quite fitting into a predetermined pattern of being barely under control This is another way in which the theme of liberation is expressed Liberation was not just an implicit theme in rock it was an overt goal and sacred mission of much of the music Bruce Springsteen talks about this often as in this 2003 interview with ABC News include quotebiblio Music of Liberation Another great quotation often attributed to Springsteen is that Elvis Presley liberated our bodies and Bob Dylan liberated our minds This expresses the great power of rock music by combining rhythms and sounds that make you want to move with lyrics and vocals that make you think and feel the best rock music liberates its listeners from programmed responses and helps them uncover their deeper more authentic and more integrated selves"

    { 
        title: "Recordings as Creative Input", 
        date: "", 
        url: "recordings-as-creative-input.html",

        content: " include quotebiblio The sort of record we need to make include quotebiblio A great trek to find the man One of my key contentions about rock music is that it was fundamentally different from earlier music forms and different in ways that were only made possible by new technology The influences of scientific and engineering advances on art are clearly visible in another 20th century art form the cinema Film of course is a medium that only came into existence through the invention of new technology Over the course of the century it is easy to see how this new art form evolved as technological advances added sound and color to the filmmaker s palette Technological influences on the development of rock music were more subtle but just as important Ultimately what we came to know as rock music would not have been possible without these technical enablers The first of these enablers I want to examine is the ability of one artist to influence another through musical recordings In the 1950 s rock n roll emerged as a distinct musical style In many ways it was the offspring produced by marrying rhythm blues music made almost exclusively by black Americans with country western which was conversely the product of white Americans The resulting hybrid was performed and listened to by both blacks and whites Elvis Presley contributed to this marriage of two different styles of music with his first single That s All Right Mama released in 1955 Listen to what William McKeen says about it in the preface to his anthology Rock And Roll Is Here To Stay include quotebiblio Those Liberating Radio Waves This union of two distinct cultures occupying the same geographical space was made possible by the technology of radio The AM airwaves knew no segregation Stations playing music for and by blacks were right next door on the AM dial to stations playing music for and by whites So it was easy for adventurous members of both groups to eavesdrop as it were on what the other was doing Whites had an unfair advantage though in that it was possible for them to easily attend black clubs to hear and observe rhythm blues performers in person while similar cross over privileges were still denied to blacks in many parts of the American South at this time As a further object lesson in the revolutionary possibilities afforded by this technical advance this ability for one artist to learn from another via sound recordings I want to look at a particular historic event the British invasion of the American airwaves that began in 1964 Let me set the stage By the early sixties rock n roll was starting to look like a fad that had run its course The plane crash that sent Buddy Holly the Big Bopper and Richie Valens to their fiery deaths in 1959 was partly to blame Another cause was the co opting of the most popular early Rocker Elvis Presley whose hits by now had retreated from their early adventurousness into a more predictable popular style Other early rockers had seen their careers sidetracked by legal problems Then at the start of 1964 something entirely unprecedented took place One week Billboard s list of top selling singles was headed up by Dominique recorded by the Singing Nun A couple of weeks later it was replaced by There I ve Said It Again a schmaltzy pop tune by Bobby Vinton Then it happened Suddenly the top spot was taken over by a rock group from England I Want To Hold Your Hand by a group called The Beatles thundered across the airwaves and into the ears bodies and souls of American teenagers Seven weeks later this song relinquished the top spot but only to another song by the same group She Loves You And two weeks later yet another Beatles song Can t Buy Me Love made the top of the hit parade Soon other British rock groups including the Animals the Yardbirds the Rolling Stones and the Kinks were vying for the attention of American listeners These events are by now so well known and so taken for granted that it is hard to realize their significance for the first time in history a generation of musicians had assimilated their influences almost exclusively through the study of recordings Eric Clapton is a good example as described by Christopher Sandford in his book Clapton Edge of Darkness include quotebiblio The trips to London So you had Eric Clapton able to perfectly mimic black American blues guitarists simply by listening to their recordings time and time again In a similar way you had Mick Jagger and Keith Richards of the Rolling Stones studying blues recordings by Muddy Waters Howling Wolf John Lee Hooker and others and producing music sounding blacker than most American music of the period You had the Beatles listening to Buddy Holly Chuck Berry and other Rockers of the fifties and then creating music of their own that matched and improved upon their American prototypes For a while things got so confusing that a thoroughly American group such as Doug Sahm s had to cloak itself in British trappings calling themselves The Sir Douglas Quintet in order to get any airplay Let s consider the artistic significance of this Prior to rock music there were essentially two types of popular music Tin Pan Alley and the recording industry turned out hits that were intentionally bland to appeal to the largest common denominator of the listening audience Most of the rough edges were removed from this music to enable its appeal to as broad a group as possible The other alternative was regional music This was more interesting because it retained its local characteristics Regional music however had limited mobility first because it relied upon the passing of musical tradition through live performances and second because it depended on the presence of a local audience Country Western Blues Rhythm Blues and Jazz all began in this way in that they depended on local influences and local audiences For example the evolution of the Chicago style of blues depended on the migration of black performers and audiences from their rural homes in the South to the more industrialized urban areas of the North The music produced by the Beatles and other British groups of the sixties fell into neither of these categories It was not watered down by commercial concerns to make it palatable to a wide audience Neither was it the result of local influences and local audiences Instead it was something radically different musical artists from one part of the world attaining immense popularity in a distant land having been influenced in many cases by foreign artists who had never achieved such wide appeal in their own homeland The artistic implications of these developments were far reaching Recording artists no longer had to be limited by local traditions They could draw from the entire palette of musical influences available on record The resulting recordings made by this new generation of musicians could appeal to global audiences And their appeal instead of being based on the ability to emulate and subtly improve upon prior regional works was instead based on the ability to generate new and different sounds that transcended their local origins The degree of artistic freedom that these developments allowed was enormous and tremendously liberating Let s return for a minute to that first single by Elvis and other early rock and roll recordings that combined musical influences from black and white America Listen to this conversation between Levon Helm Robbie Robertson and Martin Scorsese taken from Scorsese s film about The Band The Last Waltz talking about the Memphis area home to artists such as Muddy Waters Johnny Cash and Elvis Presley include quotebiblio The Middle of the Country So artists like Elvis Presley and The Beatles and countless others were able to listen to recordings from both black and white sources and make music that drew upon both Yet the way that these diverse musical sources reacted with each other in the minds of these artists is critical One possible way would be to make music based on the lowest common denominator of these sources This is exactly what some of the mainstream record labels and recording artists did with little artistic success to show for it Another way to combine them would be to add the effects of both together creating some sort of simple hybrid And certainly some early rock and roll worked in this way But ultimately these different strains of music combined in yet a different way and a way that accounts for the astonishing success of what followed Blues and gospel and rhythm and blues and bluegrass and country all became points on a musical map What all these styles of music had in common were the human voice the piano and the guitar And yet given these basic ingredients the effects to which they were put ranged from heavenly devotion to devil worship to expressions of human despair What rock artists learned from listening to all this was that not only could you use these vehicles to reach these specific destinations you could use them to reach all points in between What made this expansion of the musical landscape possible of course was the extraordinary presence of such different cultures such different experiences as those of blacks and whites in the same country the same geography People have pointed to one source or the other as being the real roots of this extraordinary music but I think this misses the critical point what made rock possible was not one particular source or another but the presence of such different sources such different cultural experiences such different modes of expression all at the same time all accessible via the same musical instruments For these multiple sources allowed rock artists to claim ownership of the entire space containing them Later developments in rock saw these trends continue to bear fruit Only a few months after the British invasion Bob Dylan gave up his primarily folk audience in order to win new popularity as a rock musician Dylan expanded the musical terrain of rock yet again broadening it to include both folk music and modern poetry From the folk tradition drawing upon the work of giants such as Woody Guthrie and Pete Seeger Dylan brought a wide ranging set of lyrical concerns including songs of protest and topicality as well as a narrative vocal tradition the ability to use simply a guitar and a single human voice to tell a story to draw a listener in to weave a fictional mythical universe From the work of modern poets such as Allen Ginsberg Dylan brought the ability to use words in novel and unusual ways to employ diverse and surreal imagery and to transcend the merely linear and literal story lines of traditional song forms And so rock continued to expand its range of influences Folk rock country rock raga rock influenced by music from India blues rock jazz rock all followed suit The significance here was not in any particular combination of formerly regional styles but in the ability of the rock musician to easily draw upon and combine such a diverse set of influences For example British rock artist Elvis Costello remembers One time my dad gave me a stack of albums he d been listening to Jefferson Airplane s Surrealistic Pillow Charles Mingus Oh Yeah a Marvin Gaye and Tammi Terrell record and the first Butterfield Blues Band album In one go I was exposed to more records than any one boy deserves USA Weekend Interview| Costello 2002 As rock musicians soaked up all these formerly distinct styles available to them on record they began to look upon these different sounds as elements of their artistic palette Under the new rules of rock music the only goal was to maximize the power and impact of a recording by using whatever techniques and effects could best contribute to the artistic success of the effort Nowhere was this merging of distinct influences available on record more apparent than in the vocal stylings employed by rock All genres of popular music preceding rock were identifiable by characteristic uses of the human voice From the twang of country the rasping of blues the nasal whine of bluegrass and the crooning of pop singers to the distinctive harmonies of gospel and doo wop each style had its own characteristic vocal sound Rock music however drew on all these influences and used them according to the needs of the individual song and the abilities of the performers So while The Rolling Stones vocals most prominently featured the heavily blues influenced voice of Mick Jagger their track You Can t Always Get What You Want employed the services of the London Bach Choir This new found freedom to draw upon a wide range of musical influences is of course entirely consistent with and representative of rock music s overall theme of liberation Rock musicians were liberated from merely regional influences and local audiences to a new ability to pick and choose devices and influences from a multitude of musical genres Rock was not the only musical form to make use of recordings as a transport mechanism for ideas from one artist to another Jazz musicians in particular took advantage of recordings as a way of learning what other artists were doing and as a means of passing traditions from one generation to others that followed But no other form took this mechanism to the extremes that rock did For example despite the tremendous popularity of jazz in Europe and the lack of any language barrier jazz has always been viewed as a uniquely American art form While Europeans and other nationalities have played it nothing like the British invasion in rock ever occurred in jazz or any other modern musical form As rock musicians of the sixties began to rely on recordings as their primary musical sources this infection mechanism had another significant artistic impact a new respect for the recordings themselves Musicians who had learned their craft by observing other artists in person quite naturally viewed live performances as the primary means of artistic expression But John Lennon Keith Richards and others assimilated their influences through repeated study of the records not of the live artists And so as we will see in the next chapter they were predisposed to view the recordings they made and not the performances they gave as their primary units of artistic output"

    { 
        title: "Recordings as Works of Art", 
        date: "", 
        url: "recordings-as-works-of-art.html", 
        summary: "<p>I&#8217;ll consider this topic from several different perspectives. </p>\n<ul>\n<li>\n<a href=\"#art-and-artist\" class=\"wiki-link\">Art and Artist</a></li>\n</ul>\n\n<section id=\"section-for-art-and-artist\">\n\n<h4 id=\"art-and-artist\">Art and Artist</h4>\n\n<p>In many modes of artistic expression, there is little question about what constitutes a work of art. </p>\n\n</section>\n", 
        content: " include quotebiblio I m a record fan I ll consider this topic from several different perspectives toc Art and Artist In many modes of artistic expression there is little question about what constitutes a work of art A painter produces a painting A sculptor creates a statue A writer publishes a novel In all of these forms there is a simple one to one relationship between an artist the output created by that artist and the work enjoyed by the public In other types of artistic expressions these relationships are more complex A classical composer creates a symphony but only as a score on paper An intermediary in the form of an orchestra is required before anyone can hear the work of art envisioned by the artist Similarly a playwright puts words on paper but a director actors and a whole drama company are required to make the play come to life before an audience In both of these cases it is clear that the artist is the composer or author and the orchestra and dramatic company are merely interpreting the work of art Twentieth century art forms have made these relationships even more complex A jazz performance typically starts with a popular song that would normally be considered a work of art on its own but then creates an elaborate series of improvisations that merely use the composer s original material as a starting point John Coltrane s famous recording of the Rodgers and Hammerstein number My Favorite Things is a case in point Coltrane and his band make the song their own going far beyond mere interpretation of the original piece To make matters even more confusing jazz musicians strive to continually create new embellishments to the original seeking to never play the same thing twice Coltrane reworked My Favorite Things over his whole career continually creating new works based on the original song We can say therefore in the case of jazz that each performance stands as a unique work of art Film offers an even more complex situation The movie To Have And Have Not represents a considerable artistic achievement It is based on a story by Ernest Hemingway and its script included work by William Faulkner so its screenplay included contributions from two of the preeminent American novelists of the 20th century But its director Howard Hawks chose the starting point specifically to prove to Hemingway that he could make a great film from his worst story And Hemingway admitted that he had written the original story when he was hard pressed for cash Faulkner freely admitted that his work as a Hollywood screenwriter was wasted and was a mere distraction from his real work as a novelist and short story writer The film features wonderful performances by Humphrey Bogart and Lauren Bacall as well as many character actors So who is the artist and what is the work of art In film it is clear the resulting movie is more than just an interpretation of the original story novel or screenplay And while modern theory credits a film s director as its auteur http en wikipedia org wiki Auteur theory or author the final work certainly depends on close collaboration by a number of creative individuals working in distinct fields A Permanent Record Woven throughout all these examples are issues of permanence and mutability While there are clearly some cases where the work of art is transient as in the case of a jazz performance there is a distinct bias towards choosing a form that endures without change Shakespeare s Romeo and Juliet has been performed many times with each performance different and few recorded in any permanent way Yet the great bard s play is immortal living on throughout the centuries delighting generation after generation with appreciation for the work building over time So we say that the written form of the play is the primary work of art and Shakespeare is the artist Creative Spontaneity vs Careful Editing It is tempting to think of great artists as being divinely inspired of channeling a muse with finished works of art passionately pouring out of them all of a piece Since it is the nature of art to create an organic whole in which all the parts seem to fit perfectly the illusion is that the work its parts and their relationships are timeless and eternal Yet when actual artists in almost any field are observed at work the divine spark is almost always found to be tempered by careful editing In truth the creative process includes both activities raw creation and focused refinement So most of our greatest works of art have been produced in media that allow such refinement and editing Shakespeare s plays could not have been produced from a strictly oral tradition the final products depended on the ability to write words down and to rewrite them Beethoven s symphonies could not have resulted from musical improvisation during live performances but depended on the ability to create musical scores And Howard Hawks films were not made from the first takes of every scene nor without careful post production editing Musical Recording as Work of Art So in rock music who is the artist and what is the work of art I will argue that in a way similar to film the final recording is the primary work of art More specifically I will contend that the work of art is a particular track or cut or recording of a song Part of the reason for this contention is that the track is the only form that lends permanence to the artist s work Live performances are transitory Even when recorded they are only a snapshot of an artist s work on a particular night And as has been amply proven in recent years the album or collection of tracks has little permanence After all as greatest hits collections boxed sets and MP3 downloads become available the one constant is the individual track Another reason for asserting the primacy of the track as the unit of artistic production is the ability of an artist to edit his performances in the studio Prior to rock musical recordings were primarily snapshots of musical performances that were created away from the studio the results of musical scores rehearsals or live performances But in rock music we see the artists using the studio itself as the medium of composition Skeletal ideas are developed in front of the microphones adding additional details to the starting concept Additional instruments are added on separate tracks playing along to recordings and not to live performances The resulting music is carefully mixed and edited sometimes combining pieces of two different performances to create the final work of art Alternatives to the Track Are there other alternative forms that could arguably be the primary ones for works of rock music I can think of three The first is the song I am referring here to the composition that can be written down on paper usually consisting of lyrics melody and chord changes This is in contrast to a track or a particular recording of a song In rock though the track has the same relationship to the song as a film has to its screenplay Both the song and the screenplay are just starting points In some cases the original screenplay may be quite literate and reflect much of the vision of the final work Just as in some cases the song can be quite moving even when performed by others In other cases screenplay and song can be quite skeletal Frank Capra s film It s a Wonderful Life which appears on many critics lists of the top films of all time was based on an original story published as a Christmas card And many rock songs began as simple riffs that were fleshed out in the recording process In both cases works of the cinema and of rock achieve greatness by adding details to the bare bones of the original composition details that become inseparable elements of the final work without which the final work of art could not take form Paul McCartney gives an interesting example of the difficulty of transcribing a Beatles recording indicating the difference between the recorded track and the published song include quotebiblio Figuring out a particular note The second credible alternative to the track as the primary artistic form for rock music is the live performance And while it is true that many great rock artists were also great live performers others such as Brian Wilson rarely if ever performed live at least during the height of his recording career In any case live performances lack the advantages of permanency and the ability to edit the final work We will see that the best rock artists took advantage of both of these attributes of studio recordings Mick Jagger of the Rolling Stones had this to say about live performances as compared to studio recordings include quotebiblio It s a load of noise The third possible alternative to the track would be the album or CD a collection of tracks Certainly many of the best rock artists produced entire albums of good material and many of these albums had a thematic and musical unity that made them worthy of consideration as works on their own This effort to make albums into works of art ultimately resulted in the attempt to produce rock operas collections of songs sharing the same characters and repeating musical themes from one song to another While some of these albums produced good tracks none of them were as compelling in their entirety as other collections that were less strained The Who s Tommy for example was not as good an album as either the Grateful Dead s Workingman s Dead or The Band s self titled second album Ultimately albums are best considered equivalent to books of poetry Both are convenient means of publication and distribution and in both cases the collections may take on lives of their own Walt Whitman s Leaves of Grass and William Blake s Songs of Experience come to mind as examples But in both cases individual works are often excerpted from the original collections and anthologized in other forms Most people who have read Blake s poem The Tiger did so out of an anthology and have not read all of the Songs of Experience And when poetry is aesthetically evaluated it is generally individual poems that are analyzed and appreciated Similarly it is the individual tracks like the individual poems that must finally stand or fall on their own artistic merit irrespective of the material that accompanied them on their initial publication Phases of Sound Reproduction and Distribution The evolution of recording technology over the years has resulted in an evolving relationship of the musician to the medium of recorded sound <table class= shaded border= 0 cellspacing= 4 cellpadding= 4 > <tr> <th class= shaded > Technology < th> <th class= shaded > Artistic Implications < th> <th class= shaded > Examples < th> < tr> <tr> <td class= shaded > No recording capability < td> <td class= shaded > Although music was enjoyed via interpretive performance music was composed and shared with others only through musical notation or by passing styles and songs down directly from one generation to another via musical performance in oral traditions < td> <td class= shaded > Classical Music Folk Music < td> < tr> <tr> <td class= shaded > Early sound recording and reproduction with distribution via radio and vinyl < td> <td class= shaded > For the first time music could be enjoyed and shared via direct sound recordings Sound quality was not good enough though to make a recording a work of art in and of itself Instead for listeners these were poor substitutes when actual live performances could not be enjoyed for musicians they were aids to learning another artist s repertoire and styles < td> <td class= shaded > Blues Jazz < td> < tr> <tr> <td class= shaded > Stereo and High Fidelity < td> <td class= shaded > For the first time the quality of the sound reproduced was good enough for the recording to be considered a primary work of art However recording technology still required a track to be recorded all at once so recording engineers and producers were essentially recording live performances under carefully controlled conditions < td> <td class= shaded > Later jazz rock n roll < td> < tr> <tr> <td class= shaded > Multi track Tape Recording < td> <td class= shaded > Multi track tape allowed different instruments and voices to be recorded on separate channels introducing the possibility of editing the track between its recording and its final distribution < td> <td class= shaded > Rock music < td> < tr> < table> Rock Recordings Let s look at some examples of rock artists use of the recording studio to produce their works To start with let s consider the work of Phil Spector in the early sixties Spector was the most vocal proponent of the producer as auteur school of thought As record producer he exerted the dominant artistic control over the tracks he produced Many of the songs he recorded were of relatively little merit on their own But Spector embellished them with his famous wall of sound production techniques using an army of musicians in the studio playing classical instruments as well as rock carefully shaping the sound so that the instruments blended together to create a single sonic effect Spector even resisted the introduction of stereo recordings preferring the monolithic effect of his wall of sound over the separation of instruments available in stereo Spector s work was among the most influential of the early sixties and was admired by later artists including The Beatles the Rolling Stones and the Beach Boys Yet his work existed and was appreciated only as sound recordings His work could only have been produced in the recording studio The idea of Spector performing his work live was inconceivable since the nature of his work as with a film director s lay so much in the particular nuances of a take and the editing together of the bits and pieces into the final work As our next example let s look at the later work of The Beatles By 1967 the group had stopped touring and devoted themselves entirely to making music in the recording studio On the album Sgt Pepper s Lonely Hearts Club Band as their most extreme example the individual tracks were elaborate recordings that the group could not possibly have performed live Not only did they rely on overdubbing the practice of recording different layers of a recording at different times they used large groups of classically trained musicians to lay down much of the music Their efforts were so impressive that fellow artists such as The Jefferson Airplane went back to the studio to do further work on their new albums after hearing The Beatles latest effort The following reflection from Ringo Starr clearly indicates the way in which The Beatles used the recording studio include quotebiblio Ringo in Nashville But even if we consider earlier work by The Beatles it is possible to make a sharp distinction between the songs they wrote and their recordings of them Lennon and McCartney were skilled pop composers and their compositions were extensively covered by other performers Most of the cover versions of their songs though were not by other rock musicians but by older more mainstream performers In fact almost without exception the hundreds of cover versions based on their work were uniformly awful by rock standards Whereas The Beatles merely started their creative process with interesting compositions and then used those songs as the foundations for masterful recordings pop artists tended to simply showcase the tunes themselves as if the accompanying instrumentation and vocals were at most mere ornamentation The results were pretty at best but almost never compelling Rock musicians avoided covering Beatles tunes I think out of respect for the original recordings They were aware that The Beatles own recordings of these songs were so complete and perfect that they left little room for other artists to perform interpretation As further examples of the distinction to be made between song and recording let s consider a couple of works by the Rolling Stones In 1969 they released two separate recordings of essentially the same song One was called Country Honk and was released on the album Let It Bleed while the other was called Honky Tonk Women and released as a single Both recordings have essentially the same lyrics melody and chord structure Yet the tracks are clearly two different works of art Country Honk is played in a laid back country style with acoustic guitars and restrained vocals The version released on the single is much more dramatic prominently featuring electric guitars playing the intro rhythm guitar and a heavy riff that accompanies the lyrics It is interesting to note that the Rolling Stones even fly in the face of traditional musical convention by giving the two recordings different names though they are clearly the same song This is further indication that the artists themselves considered the two recordings two distinct works of art It is also instructive to watch the Jean Luc Godard film Sympathy for the Devil an alternate cut of the film is called One Plus One In it you get to hear the song Sympathy for the Devil from the Rolling Stones album Beggar s Banquet as it actually developed in the studio As you watch and listen the song evolves from a simple acoustic guitar number into the final form that appeared on record The transformation is stunning offering further evidence that the recording is the ultimate work of art being produced and is much more than just an interpretation of the song Recording Studio as Musical Instrument Rock music was the first in history to rely primarily on a carefully controlled and sonically accurate sound recording as its unit of artistic expression This new medium liberated artists from the constraints of musical notation Freed from the necessity to meticulously record their compositions on paper they were able to focus their creative abilities on the details of the music that could not be recorded in conventional music The particular sound of an electric guitar or of a bass drum became as important as the notes being played Recordings such as Jimi Hendrix s rendition of The Star Spangled Banner or Phil Spector s Christmas album demonstrated how thoroughly the artistry of performer and recording artist could completely transform original compositions into distinctive new works of art And just as the cinema created a new art form from the old elements of actor and play rock created a new form based on the old elements of performer and song In both cases the ability to control in great detail the presentation of the old elements created new forms in which artistry found new room for creative expression in these very details the lighting on an actress face the shadings of a singer s voice In the case of the cinema these were details that could only be captured on film In the case of rock these were details that could only be captured in a recording Here is how Paul McCartney remembers the period when The Beatles started to make time in their schedules to really stretch out in the recording studio include quotebiblio You can have a studio and you can take your time And here s how George Harrison remembers some of the opportunities afforded by the recording studios at Abbey Road include quotebiblio We d look around the cupboard Ringo Starr recalls the pioneering use of an Indian sitar on one of their tracks Norwegian Wood include quotebiblio When George introduced the sitar Ringo also remembers the way in which The Beatles use of the studio began to evolve as they spent more time there include quotebiblio George Martin was very good But creating in the studio was not just a luxury afforded the most successful of rock stars The Jimi Hendrix Experience worked this way even on their first album before achieving any kind of financial success as Sean Egan recounts include quotebiblio Jimi Hendrix Experience recording style So for The Beatles and other rock groups the studio was becoming more than just a place to capture their live act in pristine conditions Instead the studio was the place where the primary act of creation took place Relationship of Artist to Audience The other significant impact of the recorded medium is on the relationship of artist to audience In earlier musical forms the primary connection between musical artist and listener was through the medium of live performance However the nature of the venues where the music was performed clearly impacted the content of the art Live performances were almost always in public places to relatively large audiences Jazz and blues musicians often performed in bars or in other venues where their music had to compete for attention with other activities In many cases listening audiences were also dancing audiences and so the rhythms were often more important than the lyrics As musicians such as The Beatles began recording however they connected to their audiences primarily through their records No longer was the music fashioned to communicate to a large crowd in a public venue instead it could be created with the confidence that listening might often be a more personal private affair include quotebiblio Rock does this thing to you"
